<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>旅平險保費試算系統</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Flatpickr (極速一鍵選取日曆) CSS & JS & 繁體中文語系 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/zh-tw.js"></script>
  
  <style>
    :root {
      --primary-color: #1e40af;
      --border-radius: 12px;
      --font-family: 'Noto Sans TC', sans-serif;
      --card-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
      --footer-color: #0f172a;
    }
    body {
      font-family: var(--font-family);
      background-color: #f8fafc;
    }
    .custom-card {
      border-radius: var(--border-radius);
      box-shadow: var(--card-shadow);
    }
    .btn-primary {
      background-color: var(--primary-color);
      border-radius: var(--border-radius);
    }
    /* 隱藏原生 Chrome/Safari 等瀏覽器 input[type=number] 的小箭頭 */
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type=number] {
      -moz-appearance: textfield; /* Firefox */
    }
    /* Flatpickr 樣式自訂 - 完美契合主色 */
    .flatpickr-day.selected, .flatpickr-day.selected:hover {
      background: var(--primary-color) !important;
      border-color: var(--primary-color) !important;
    }
    .flatpickr-months .flatpickr-month {
      color: #0f172a !important;
    }
    .flatpickr-current-month .flatpickr-monthDropdown-months {
      font-weight: 700 !important;
    }
  </style>
</head>
<body class="text-gray-800 antialiased min-h-screen flex flex-col pb-24 lg:pb-0">

  <!-- 系統公告卡片 (依試算表動態控制) -->
  <div id="announcementBanner" class="hidden bg-amber-50 border-b border-amber-200 py-3 px-4 text-center text-amber-900 text-xs md:text-sm font-medium flex items-center justify-center gap-2">
    <i data-lucide="megaphone" class="w-4 h-4 text-amber-600 flex-shrink-0"></i>
    <span id="announcementText"></span>
  </div>

  <!-- 頂部導覽列 -->
  <header class="bg-white border-b border-gray-100 py-4 px-6 sticky top-0 z-40 shadow-sm">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-2">
        <i data-lucide="shield-check" class="w-6 h-6 text-blue-700"></i>
        <h1 id="siteTitle" class="text-lg md:text-xl font-bold text-gray-900">旅平險保費試算</h1>
      </div>
      <div class="text-right">
        <span id="effectiveDate" class="text-xs text-gray-400 bg-gray-50 px-2.5 py-1 rounded-full font-medium">適用載入中...</span>
      </div>
    </div>
  </header>

  <!-- 系統維護畫面 (預設隱藏，API出錯時顯示) -->
  <div id="maintenanceScreen" class="hidden fixed inset-0 bg-white z-50 flex flex-col items-center justify-center p-6 text-center">
    <div class="w-16 h-16 bg-red-50 text-red-600 rounded-full flex items-center justify-center mb-4">
      <i data-lucide="alert-triangle" class="w-8 h-8"></i>
    </div>
    <h2 class="text-2xl font-bold text-gray-900 mb-2">目前系統維護中</h2>
    <p class="text-gray-500 max-w-md">我們正在更新費率與系統設定，請稍後再試。造成不便敬請見諒。</p>
  </div>

  <!-- 主內容區域 -->
  <main class="flex-grow max-w-7xl w-full mx-auto p-4 md:p-6 lg:p-8 grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
    
    <!-- 左側：輸入表單 (佔 7 格) -->
    <div class="lg:col-span-7 space-y-5">
      
      <!-- 1. 旅遊地區 -->
      <div class="bg-white p-5 rounded-xl border border-gray-100 custom-card">
        <label id="lblTravelArea" class="block text-sm font-semibold text-gray-900 mb-3">旅遊地區</label>
        <div class="grid grid-cols-2 gap-2 bg-gray-100 p-1 rounded-lg">
          <button id="btnAreaOvs" class="py-2.5 text-sm font-bold rounded-md transition-all text-center focus:outline-none" onclick="AppController.setArea('overseas')">
            海外旅遊
          </button>
          <button id="btnAreaDom" class="py-2.5 text-sm font-bold rounded-md transition-all text-center focus:outline-none" onclick="AppController.setArea('domestic')">
            國內旅遊
          </button>
        </div>
      </div>

      <!-- 2. 保險期間 (黃金正方形佈局) -->
      <div class="bg-white p-5 rounded-xl border border-gray-100 custom-card">
        <div class="grid grid-cols-2 gap-4">
          <!-- 左半邊：保險生效日 -->
          <div class="space-y-2">
            <label class="block text-sm font-semibold text-gray-900">保險生效日</label>
            <!-- 採用 Flatpickr 取代原生 Date Picker -->
            <input type="text" id="startDate" class="w-full px-3 py-2.5 border border-gray-200 rounded-lg text-sm font-medium bg-white focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 outline-none transition cursor-pointer" placeholder="選擇日期" readonly>
            <select id="startHour" class="w-full px-3 py-2.5 border border-gray-200 rounded-lg text-sm font-medium bg-white focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 outline-none transition" onchange="AppController.onPeriodChange()">
              <!-- 1 ~ 24 時 -->
            </select>
          </div>
          <!-- 右半邊：保險結束日 -->
          <div class="space-y-2">
            <label class="block text-sm font-semibold text-gray-900">保險結束日</label>
            <!-- 採用 Flatpickr 取代原生 Date Picker -->
            <input type="text" id="endDate" class="w-full px-3 py-2.5 border border-gray-200 rounded-lg text-sm font-medium bg-white focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 outline-none transition cursor-pointer" placeholder="選擇日期" readonly>
            <select id="endHour" class="w-full px-3 py-2.5 border border-gray-200 rounded-lg text-sm font-medium bg-white focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 outline-none transition" onchange="AppController.onPeriodChange()">
              <!-- 1 ~ 24 時 -->
            </select>
          </div>
          <!-- 下方橫條：旅遊天數 (支援防禦型紅框警告) -->
          <div id="daysCardContainer" class="col-span-2 bg-blue-50/50 border border-blue-100 p-3 rounded-lg flex flex-col gap-1 transition-all duration-200">
            <div class="flex justify-between items-center">
              <span class="text-xs font-bold text-blue-800">旅遊天數</span>
              <div class="flex items-center gap-1">
                <span id="txtDays" class="text-base font-black text-blue-900">1</span>
                <span class="text-xs text-blue-800">天</span>
              </div>
            </div>
            <!-- 動態警告訊息容器 -->
            <div id="daysWarningContainer" class="hidden text-xs font-bold text-red-600 flex items-center gap-1.5 mt-1"></div>
          </div>
        </div>
      </div>

      <!-- 3. 海外突發疾病 (海外專用) -->
      <div id="diseaseSection" class="bg-white p-5 rounded-xl border border-gray-100 custom-card transition-all">
        <label class="block text-sm font-semibold text-gray-900 mb-3">海外突發疾病</label>
        <div class="grid grid-cols-2 gap-2 bg-gray-100 p-1 rounded-lg">
          <button id="btnDiseaseWith" class="py-2 text-xs font-bold rounded-md transition-all text-center focus:outline-none" onclick="AppController.setDisease(true)">
            含法定傳染病
          </button>
          <button id="btnDiseaseWithout" class="py-2 text-xs font-bold rounded-md transition-all text-center focus:outline-none" onclick="AppController.setDisease(false)">
            不含法定傳染病
          </button>
        </div>
      </div>

      <!-- 4. 投保方案 (改為下拉選項) -->
      <div class="bg-white p-5 rounded-xl border border-gray-100 custom-card">
        <label class="block text-sm font-semibold text-gray-900 mb-3">投保方案</label>
        <div class="relative">
          <select id="selProduct" class="w-full px-3 py-3 border border-gray-200 rounded-lg text-sm bg-white font-bold text-gray-950 focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 outline-none transition appearance-none" onchange="AppController.onProductSelectChange()">
            <!-- 動態載入商品下拉選項 -->
          </select>
          <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-gray-500">
            <i data-lucide="chevron-down" class="w-4 h-4"></i>
          </div>
        </div>
      </div>

      <!-- 5. 整合投保人數與保障額度 (依照圖片 2 版面整合 + 人數改為可輸入框) -->
      <div class="bg-white p-5 rounded-xl border border-gray-100 custom-card space-y-6">
        
        <!-- A. 投保人數區 (圖片 2 上半部 + 人數 Stepper 輸入框化) -->
        <div class="grid grid-cols-2 gap-4 border-b border-gray-100 pb-5">
          <!-- 左欄：15歲以上人數 (大人) -->
          <div class="flex flex-col items-center p-3 bg-slate-50/50 rounded-xl border border-slate-100">
            <span class="text-xs font-bold text-slate-500 mb-1" id="lblAdult">15歲以上人數</span>
            <div class="flex items-center gap-2 my-1.5">
              <button class="w-8 h-8 bg-white text-gray-600 border border-gray-200 rounded-full font-bold flex items-center justify-center hover:bg-gray-100 transition focus:outline-none shadow-sm active:scale-95" onclick="AppController.adjustCount('adult', -1)">-</button>
              <!-- 改為 input 輸入框，隱藏原生箭頭，文字置中，支援手動修改 -->
              <input type="number" id="txtAdultCount" class="w-12 h-8 text-center font-bold text-base text-gray-900 border border-gray-200 rounded bg-white focus:ring-1 focus:ring-blue-500 focus:outline-none" value="1" min="0" oninput="AppController.onCountInputChange('adult')" onblur="AppController.onCountInputBlur('adult')">
              <button class="w-8 h-8 bg-white text-gray-600 border border-gray-200 rounded-full font-bold flex items-center justify-center hover:bg-gray-100 transition focus:outline-none shadow-sm active:scale-95" onclick="AppController.adjustCount('adult', 1)">+</button>
            </div>
            <div class="text-[11px] text-gray-400 mt-0.5">每人保費: <span id="txtAdultUnitPrice" class="font-bold text-blue-700">$-</span></div>
          </div>

          <!-- 右欄：未滿15歲人數 (小孩) -->
          <div class="flex flex-col items-center p-3 bg-slate-50/50 rounded-xl border border-slate-100">
            <span class="text-xs font-bold text-slate-500 mb-1" id="lblChild">未滿15歲人數</span>
            <div class="flex items-center gap-2 my-1.5">
              <button class="w-8 h-8 bg-white text-gray-600 border border-gray-200 rounded-full font-bold flex items-center justify-center hover:bg-gray-100 transition focus:outline-none shadow-sm active:scale-95" onclick="AppController.adjustCount('child', -1)">-</button>
              <!-- 改為 input 輸入框，隱藏原生箭頭，文字置中，支援手動修改 -->
              <input type="number" id="txtChildCount" class="w-12 h-8 text-center font-bold text-base text-gray-900 border border-gray-200 rounded bg-white focus:ring-1 focus:ring-blue-500 focus:outline-none" value="0" min="0" oninput="AppController.onCountInputChange('child')" onblur="AppController.onCountInputBlur('child')">
              <button class="w-8 h-8 bg-white text-gray-600 border border-gray-200 rounded-full font-bold flex items-center justify-center hover:bg-gray-100 transition focus:outline-none shadow-sm active:scale-95" onclick="AppController.adjustCount('child', 1)">+</button>
            </div>
            <div class="text-[11px] text-gray-400 mt-0.5">每人保費: <span id="txtChildUnitPrice" class="font-bold text-blue-700">$-</span></div>
          </div>
        </div>

        <!-- B. 保障額度設定區 (圖片 2 下半部) -->
        <div class="space-y-4">
          <div class="text-sm font-semibold text-gray-900 flex items-center gap-1.5">
            <i data-lucide="shield-alert" class="w-4 h-4 text-blue-700"></i>
            <span>保障額度</span>
          </div>
          
          <div class="grid grid-cols-2 gap-4">
            <!-- 左欄：15歲以上身故保額 -->
            <div>
              <label class="block text-[11px] font-bold text-gray-500 mb-1.5">15歲以上身故保額</label>
              <select id="selAdultDeath" class="w-full px-3 py-2.5 border border-gray-200 rounded-lg text-sm bg-white font-medium focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 outline-none transition" onchange="AppController.onLimitChange()">
                <!-- 動態 -->
              </select>
            </div>
            <!-- 右欄：未滿15歲失能保額 (配合圖片 2 變更名稱) -->
            <div>
              <label class="block text-[11px] font-bold text-gray-500 mb-1.5">未滿15歲失能保額</label>
              <select id="selChildDeath" class="w-full px-3 py-2.5 border border-gray-200 rounded-lg text-sm bg-white font-medium focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 outline-none transition" onchange="AppController.onLimitChange()">
                <!-- 動態 -->
              </select>
            </div>
          </div>

          <!-- 橫跨整排：傷害醫療保額 -->
          <div>
            <label class="block text-[11px] font-bold text-gray-500 mb-1.5">傷害醫療保額</label>
            <select id="selMedical" class="w-full px-3 py-2.5 border border-gray-200 rounded-lg text-sm bg-white font-medium focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 outline-none transition" onchange="AppController.onLimitChange()">
              <!-- 動態 -->
            </select>
          </div>
        </div>

      </div>

    </div>

    <!-- 右側：摘要卡片、保障內容、注意事項 (佔 5 格) -->
    <div class="lg:col-span-5 space-y-5">
      
      <!-- 桌機版固定右側總保費卡 (RWD會在手機版隱藏) -->
      <div class="hidden lg:block bg-white p-6 rounded-xl border border-gray-100 custom-card sticky top-24 z-30">
        <h3 class="text-xs font-bold text-gray-400 tracking-wider uppercase mb-2">試算結果摘要</h3>
        <div class="flex justify-between items-baseline mb-4">
          <span class="text-sm font-medium text-gray-500">應收總保費</span>
          <div>
            <span class="text-xs font-bold text-blue-700">NT$</span>
            <span id="desktopTotalPremium" class="text-3xl font-black text-blue-900">0</span>
          </div>
        </div>
        <div class="space-y-2.5 text-xs text-gray-500 border-t border-gray-100 pt-4 mb-5">
          <div class="flex justify-between">
            <span>旅遊天數:</span>
            <span class="font-bold text-gray-800"><span id="summaryDays">1</span> 天</span>
          </div>
          <div class="flex justify-between">
            <span>所選方案:</span>
            <span class="font-bold text-gray-800" id="summaryProduct">-</span>
          </div>
          <div class="flex justify-between">
            <span>投保人數:</span>
            <span class="font-bold text-gray-800"><span id="summaryAdults">1</span>大 / <span id="summaryChildren">0</span>小</span>
          </div>
        </div>
        <button onclick="AppController.copyLineQuote()" class="w-full py-3 px-4 btn-primary text-white font-bold text-sm shadow-md hover:brightness-105 active:scale-[0.98] transition flex items-center justify-center gap-2">
          <i data-lucide="copy" class="w-4 h-4"></i>
          複製 LINE 格式報價
        </button>
      </div>

      <!-- 6. 方案承保內容 -->
      <div id="coverageSection" class="bg-white p-5 rounded-xl border border-gray-100 custom-card">
        <div class="flex items-center gap-2 border-b border-gray-100 pb-3 mb-4">
          <i data-lucide="shield" class="w-5 h-5 text-blue-700"></i>
          <h3 id="lblCoverage" class="text-sm font-bold text-gray-900">方案承保內容</h3>
        </div>
        <div id="coverageList" class="space-y-3">
          <!-- 動態渲染保障項目 -->
        </div>
      </div>

      <!-- 7. 投保注意事項 -->
      <div id="noticeSection" class="bg-white p-5 rounded-xl border border-gray-100 custom-card">
        <div class="flex items-center gap-2 border-b border-gray-100 pb-3 mb-4">
          <i data-lucide="info" class="w-5 h-5 text-amber-500"></i>
          <h3 id="lblNotice" class="text-sm font-bold text-gray-900">注意事項</h3>
        </div>
        <ul id="noticeList" class="space-y-2 list-disc list-inside text-xs text-gray-500 leading-relaxed">
          <!-- 動態渲染注意事項 -->
        </ul>
      </div>

    </div>
  </main>

  <!-- 手機版 Sticky Footer (手機版專用) -->
  <div class="lg:hidden fixed bottom-0 left-0 right-0 bg-slate-900 text-white p-4 flex items-center justify-between border-t border-slate-800 z-40 shadow-lg">
    <div>
      <span class="block text-[10px] text-slate-400 font-bold tracking-wider" id="mobileTotalPremiumLabel">應收總保費</span>
      <div class="flex items-baseline gap-1 mt-0.5">
        <span class="text-[10px] text-slate-300 font-semibold">NT$</span>
        <span id="mobileTotalPremium" class="text-2xl font-black text-blue-400">0</span>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <div class="text-right text-[10px] text-slate-400 font-semibold mr-1">
        <div><span id="mobileSummaryDays">1</span> 天</div>
        <div><span id="mobileSummaryAdults">1</span>大 / <span id="mobileSummaryChildren">0</span>小</div>
      </div>
      <button onclick="AppController.copyLineQuote()" class="bg-blue-600 text-white font-bold text-xs py-2.5 px-3.5 rounded-lg shadow active:scale-95 transition flex items-center gap-1.5">
        <i data-lucide="copy" class="w-3.5 h-3.5"></i>
        複製報價
      </button>
    </div>
  </div>

  <!-- 成功提示 Toast 訊息 -->
  <div id="toast" class="fixed top-24 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white px-4 py-2.5 rounded-full text-xs font-semibold shadow-xl opacity-0 scale-95 pointer-events-none transition-all duration-300 z-50 flex items-center gap-1.5">
    <i data-lucide="check-circle" class="w-4 h-4 text-emerald-400"></i>
    <span id="toastMsg">複製成功！</span>
  </div>

  <!-- JS 邏輯區 -->
  <script>
    // 串接使用者部署好的 Google Apps Script 雲端 API 網址
    const GOOGLE_APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzCudyI5uo1lDZXVsUfTxZrfzeLrLLzUh70N38HWLcAsn75-22G44cZ5ijzmyH86MJx/exec";
    const CACHE_KEY = "TRAVEL_INS_CACHE_V3";
    const CACHE_TIME_KEY = "TRAVEL_INS_CACHE_TIME_V3";
    const CACHE_DURATION_MS = 5 * 60 * 1000; // 5 分鐘快取

    // 全域資料儲存庫
    let globalDB = {
      control: {},
      products: [],
      productOptions: [],
      rates: [],
      coverages: [],
      notes: [],
      ui: {},
      texts: {}
    };

    // 前台操作狀態管理
    let clientState = {
      area: 'overseas',          // 'domestic' | 'overseas'
      diseaseOption: true,      // true (含法傳) | false (不含)
      selectedProductId: '',     // 當前方案編號
      startDate: '',
      startHour: 10,
      endDate: '',
      endHour: 10,
      days: 1,
      adultDeath: '',
      childDeath: '',
      medical: '',
      adultCount: 1,
      childCount: 0
    };

    // Flatpickr 控制物件
    let startPickerInstance = null;
    let endPickerInstance = null;

    // 系統初始化入口
    window.onload = async function() {
      // 1. 生成 1~24 小時的下拉選單
      initHourSelectors();
      
      // 2. 初始化 Flatpickr 與預設日期
      initCalendarAndDates();

      // 3. 讀取並套用雲端資料庫
      await loadDatabase();

      // 4. 初始化 Lucide 圖標
      lucide.createIcons();
    };

    // 生成小時選項
    function initHourSelectors() {
      const startSel = document.getElementById("startHour");
      const endSel = document.getElementById("endHour");
      for (let i = 1; i <= 24; i++) {
        const optStart = document.createElement("option");
        optStart.value = i;
        optStart.textContent = `${i} 時`;
        startSel.appendChild(optStart);

        const optEnd = document.createElement("option");
        optEnd.value = i;
        optEnd.textContent = `${i} 時`;
        endSel.appendChild(optEnd);
      }
      startSel.value = 10;
      endSel.value = 10;
    }

    // 初始化 Flatpickr 與預設日期設定
    function initCalendarAndDates() {
      const today = new Date();
      const tomorrow = new Date();
      tomorrow.setDate(today.getDate() + 1);

      const toDateString = (d) => {
        const year = d.getFullYear();
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${year}/${month}/${day}`; // 強制以斜線輸出
      };

      const todayStr = toDateString(today);
      const tomorrowStr = toDateString(tomorrow);

      clientState.startDate = todayStr;
      clientState.endDate = tomorrowStr;

      // 生效日日曆初始化
      startPickerInstance = flatpickr("#startDate", {
        locale: "zh_tw",
        dateFormat: "Y/m/d",
        defaultDate: todayStr,
        disableMobile: "true", // 防止行動裝置喚起原生的 Done 滾輪
        onChange: function(selectedDates, dateStr) {
          clientState.startDate = dateStr;
          AppController.onPeriodChange();
        }
      });

      // 結束日日曆初始化
      endPickerInstance = flatpickr("#endDate", {
        locale: "zh_tw",
        dateFormat: "Y/m/d",
        defaultDate: tomorrowStr,
        disableMobile: "true",
        onChange: function(selectedDates, dateStr) {
          clientState.endDate = dateStr;
          AppController.onPeriodChange();
        }
      });
    }

    // 載入資料庫：優先使用快取，過期則重新呼叫 API
    async function loadDatabase() {
      const cacheData = localStorage.getItem(CACHE_KEY);
      const cacheTime = localStorage.getItem(CACHE_TIME_KEY);
      const now = Date.now();

      if (cacheData && cacheTime && (now - parseInt(cacheTime) < CACHE_DURATION_MS)) {
        try {
          globalDB = JSON.parse(cacheData);
          applyDBData();
          return;
        } catch(e) {
          console.error("解析快取失敗，改用 API 獲取", e);
        }
      }

      // 無快取或快取過期，向 Google Apps Script 發送 Request
      try {
        const response = await fetch(GOOGLE_APPS_SCRIPT_URL);
        if (!response.ok) throw new Error("API 回應失敗");
        const data = await response.json();
        
        if (data.error) throw new Error(data.error);

        // 寫入快取與記憶體
        globalDB = data;
        localStorage.setItem(CACHE_KEY, JSON.stringify(data));
        localStorage.setItem(CACHE_TIME_KEY, now.toString());

        applyDBData();
      } catch (err) {
        console.error("雲端 API 連線失敗", err);
        // 若快取可用則作為降級方案
        if (cacheData) {
          globalDB = JSON.parse(cacheData);
          applyDBData();
          showToast("⚠️ API 讀取失敗，改採離線快取資料");
        } else {
          // 無法讀取且無快取，顯示維護畫面
          document.getElementById("maintenanceScreen").classList.remove("hidden");
        }
      }
    }

      // 依地區與法傳篩選商品 (方案改為下拉選項)
      static updateProducts() {
        const selectEl = document.getElementById("selProduct");
        selectEl.innerHTML = "";

        // 篩選商品
        const filtered = globalDB.products.filter(p => {
          if (!p.Enable) return false;
          if (p.Area !== clientState.area) return false;
          if (clientState.area === 'overseas') {
            // 海外方案需要比對是否符合法傳選項
            return p.DiseaseOption === (clientState.diseaseOption ? "含法定傳染病" : "不含法定傳染病");
          }
          return true;
        });

        // 依排序權重 Sorting
        filtered.sort((a, b) => (a.Sort || 0) - (b.Sort || 0));

        if (filtered.length === 0) {
          const opt = document.createElement("option");
          opt.value = "";
          opt.textContent = "無符合之方案計畫";
          selectEl.appendChild(opt);
          clientState.selectedProductId = "";
          this.updateProductOptions();
          return;
        }

        // 渲染商品下拉選項
        filtered.forEach((prod, idx) => {
          const opt = document.createElement("option");
          opt.value = prod.ProductID;
          // 若海外方案包含法定傳染病提示，合併於文字中方便選取
          const diseaseTag = prod.DiseaseOption ? ` (${prod.DiseaseOption})` : "";
          opt.textContent = `${prod.ProductName}${diseaseTag}`;
          selectEl.appendChild(opt);
        });

        // 預設選取當前已選的 ID，若不在清單中則選第一個
        const hasMatch = filtered.some(p => p.ProductID === clientState.selectedProductId);
        if (!hasMatch && filtered.length > 0) {
          clientState.selectedProductId = filtered[0].ProductID;
        }
        selectEl.value = clientState.selectedProductId;

        this.updateProductOptions();
      }

      // 下拉選單方案改變時觸發
      static onProductSelectChange() {
        const selectEl = document.getElementById("selProduct");
        clientState.selectedProductId = selectEl.value;
        this.updateProductOptions();
      }

      // 更新保額與醫療等選項
      static updateProductOptions() {
        const prodId = clientState.selectedProductId;
        const selAdult = document.getElementById("selAdultDeath");
        const selChild = document.getElementById("selChildDeath");
        const selMedical = document.getElementById("selMedical");

        selAdult.innerHTML = "";
        selChild.innerHTML = "";
        selMedical.innerHTML = "";

        if (!prodId) {
          selAdult.innerHTML = `<option value="">無</option>`;
          selChild.innerHTML = `<option value="">無</option>`;
          selMedical.innerHTML = `<option value="">無</option>`;
          this.calculatePremium();
          return;
        }

        // 從 商品選項 表過濾該 ProductID
        const options = globalDB.productOptions.filter(o => o.ProductID === prodId && o.Enable);
        options.sort((a, b) => (a.Sort || 0) - (b.Sort || 0));

        if (options.length === 0) {
          selAdult.innerHTML = `<option value="">無</option>`;
          selChild.innerHTML = `<option value="">無</option>`;
          selMedical.innerHTML = `<option value="">無</option>`;
          return;
        }

        // 取不重複的選項填入下拉選單
        const adults = [...new Set(options.map(o => o.AdultDeath))].filter(Boolean);
        const children = [...new Set(options.map(o => o.ChildDeath))].filter(Boolean);
        const medicals = [...new Set(options.map(o => o.Medical))].filter(Boolean);

        adults.forEach(val => {
          const opt = document.createElement("option");
          opt.value = val;
          opt.textContent = val;
          selAdult.appendChild(opt);
        });

        children.forEach(val => {
          const opt = document.createElement("option");
          opt.value = val;
          opt.textContent = val;
          selChild.appendChild(opt);
        });

        medicals.forEach(val => {
          const opt = document.createElement("option");
          opt.value = val;
          opt.textContent = val;
          selMedical.appendChild(opt);
        });

        // 預設選擇第一個
        clientState.adultDeath = adults[0] || '';
        clientState.childDeath = children[0] || '';
        clientState.medical = medicals[0] || '';

        this.syncDynamicSections();
        this.calculatePremium();
      }

      // 當起迄日或時間改變
      static onPeriodChange() {
        clientState.startHour = parseInt(document.getElementById("startHour").value);
        clientState.endHour = parseInt(document.getElementById("endHour").value);

        this.calculateDays();
        this.calculatePremium();
      }

      // 核心天數運算：採 Unix Epoch 時間戳差並使用 Math.ceil 無條件進位 (解決倒退 Bug 並防禦限額)
      static calculateDays() {
        const startVal = clientState.startDate;
        const endVal = clientState.endDate;
        const startH = clientState.startHour;
        const endH = clientState.endHour;

        const daysCard = document.getElementById("daysCardContainer");
        const warningContainer = document.getElementById("daysWarningContainer");

        if (!startVal || !endVal) {
          clientState.days = 1;
          this.updateDaysUI();
          return;
        }

        // 將斜線格式的字串 YYYY/MM/DD 在生成 Date 前暫時格式化為橫線以保持 ISO 相容性
        const formatISO = (s) => s.replace(/\//g, '-');
        const startDateTime = new Date(`${formatISO(startVal)}T${String(startH).padStart(2, '0')}:00:00`);
        const endDateTime = new Date(`${formatISO(endVal)}T${String(endH).padStart(2, '0')}:00:00`);

        let errorMsg = "";

        if (startDateTime > endDateTime) {
          // 生效日晚於結束日
          errorMsg = "保險生效日不可晚於結束日！";
        } else {
          // 計算總時差並採無條件進位
          const diffMs = endDateTime.getTime() - startDateTime.getTime();
          const diffHours = diffMs / (1000 * 60 * 60);
          let calculatedDays = Math.ceil(diffHours / 24);

          if (calculatedDays <= 0) calculatedDays = 1;

          // 國內 / 海外天數限額驗證
          if (clientState.area === 'domestic' && calculatedDays > 14) {
            errorMsg = `國內旅遊投保天數最多 14 天！(目前 ${calculatedDays} 天)`;
          } else if (clientState.area === 'overseas' && calculatedDays > 180) {
            errorMsg = `海外旅遊投保天數最多 180 天！(目前 ${calculatedDays} 天)`;
          }

          clientState.days = calculatedDays;
        }

        // 警示 UI 切換渲染
        if (errorMsg) {
          // 改為明顯粗紅框、粉紅底
          daysCard.className = "col-span-2 bg-red-50 border-2 border-red-500 p-3 rounded-lg flex flex-col gap-1 transition-all duration-200 shadow-sm";
          warningContainer.className = "text-xs font-black text-red-600 flex items-center gap-1 mt-1";
          warningContainer.innerHTML = `<i data-lucide="alert-triangle" class="w-4 h-4 text-red-600 flex-shrink-0"></i><span>${errorMsg}</span>`;
          warningContainer.classList.remove("hidden");
          lucide.createIcons();

          // 天數鎖定
          clientState.days = 0; 
          this.updateDaysUI(true);
        } else {
          // 還原預設藍綠色排版
          daysCard.className = "col-span-2 bg-blue-50/50 border border-blue-100 p-3 rounded-lg flex flex-col gap-1 transition-all duration-200";
          warningContainer.classList.add("hidden");
          warningContainer.innerHTML = "";

          this.updateDaysUI(false);
        }
      }

      static updateDaysUI(isError = false) {
        const daysVal = isError ? "--" : clientState.days;
        document.getElementById("txtDays").textContent = daysVal;
        document.getElementById("summaryDays").textContent = daysVal;
        document.getElementById("mobileSummaryDays").textContent = daysVal;
      }

      // 當額度選項變更時
      static onLimitChange() {
        clientState.adultDeath = document.getElementById("selAdultDeath").value;
        clientState.childDeath = document.getElementById("selChildDeath").value;
        clientState.medical = document.getElementById("selMedical").value;

        this.calculatePremium();
      }

      // 計算總保費 (阻斷天數超限)
      static calculatePremium() {
        const prodId = clientState.selectedProductId;
        const days = clientState.days;
        const adDeath = clientState.adultDeath;
        const chDeath = clientState.childDeath;
        const med = clientState.medical;

        let adultPrice = 0;
        let childPrice = 0;

        // 若有天數或日期設定錯誤，停止查費
        if (days > 0 && prodId) {
          // 搜尋合適費率
          const rateRecord = globalDB.rates.find(r => 
            r.ProductID === prodId &&
            parseInt(r.Days) === parseInt(days) &&
            r.AdultDeath === adDeath &&
            r.ChildDeath === chDeath &&
            r.Medical === med
          );

          if (rateRecord) {
            adultPrice = parseInt(rateRecord.AdultPremium) || 0;
            childPrice = parseInt(rateRecord.ChildPremium) || 0;
            
            document.getElementById("txtAdultUnitPrice").textContent = `NT$ ${adultPrice.toLocaleString()}`;
            document.getElementById("txtChildUnitPrice").textContent = `NT$ ${childPrice.toLocaleString()}`;
          } else {
            // 查無資料，可能因為無對應的天數費率
            document.getElementById("txtAdultUnitPrice").textContent = "查無費率";
            document.getElementById("txtChildUnitPrice").textContent = "查無費率";
          }
        } else {
          document.getElementById("txtAdultUnitPrice").textContent = "$-";
          document.getElementById("txtChildUnitPrice").textContent = "$-";
        }

        // 計算總保費
        const total = (adultPrice * clientState.adultCount) + (childPrice * clientState.childCount);

        // 更新 UI 數據 (若有錯改顯示 --)
        const displayTotal = days > 0 ? total.toLocaleString() : "--";
        document.getElementById("desktopTotalPremium").textContent = displayTotal;
        document.getElementById("mobileTotalPremium").textContent = displayTotal;

        const curProd = globalDB.products.find(p => p.ProductID === prodId);
        const prodName = curProd ? curProd.ProductName : '-';
        
        const summaryProdEl = document.getElementById("summaryProduct");
        if (summaryProdEl) {
          summaryProdEl.textContent = prodName;
        }

        this.updateSummaryPeople();
      }

      // 人數調整器 (Stepper 點擊按鈕調校)
      static adjustCount(type, delta) {
        const inputEl = document.getElementById(type === 'adult' ? "txtAdultCount" : "txtChildCount");
        let currentVal = parseInt(inputEl.value) || 0;
        let newVal = currentVal + delta;
        if (newVal < 0) newVal = 0;
        
        inputEl.value = newVal;

        if (type === 'adult') {
          clientState.adultCount = newVal;
        } else {
          clientState.childCount = newVal;
        }
        this.calculatePremium();
      }

      // 人數手動輸入框鍵入更新
      static onCountInputChange(type) {
        const inputEl = document.getElementById(type === 'adult' ? "txtAdultCount" : "txtChildCount");
        let val = inputEl.value;

        // 當使用者在打字留空或不合規時，暫時對應為 0 進行運算
        let numVal = parseInt(val);
        if (isNaN(numVal) || numVal < 0) {
          numVal = 0;
        }

        if (type === 'adult') {
          clientState.adultCount = numVal;
        } else {
          clientState.childCount = numVal;
        }
        this.calculatePremium();
      }

      // 人數手動輸入框點開/離開防呆還原
      static onCountInputBlur(type) {
        const inputEl = document.getElementById(type === 'adult' ? "txtAdultCount" : "txtChildCount");
        let val = parseInt(inputEl.value);
        
        // 若點擊其他地方仍為空白、負數或無效值，強制歸 0 還原視覺
        if (isNaN(val) || val < 0) {
          val = 0;
        }
        inputEl.value = val;

        if (type === 'adult') {
          clientState.adultCount = val;
        } else {
          clientState.childCount = val;
        }
        this.calculatePremium();
      }

      // 同步右側摘要卡人數
      static updateSummaryPeople() {
        document.getElementById("summaryAdults").textContent = clientState.adultCount;
        document.getElementById("summaryChildren").textContent = clientState.childCount;
        document.getElementById("mobileSummaryAdults").textContent = clientState.adultCount;
        document.getElementById("mobileSummaryChildren").textContent = clientState.childCount;
      }

      // 渲染動態保障細項與注意事項
      static syncDynamicSections() {
        const prodId = clientState.selectedProductId;

        // 1. 承保內容項目
        const covList = document.getElementById("coverageList");
        covList.innerHTML = "";

        if (!prodId) {
          document.getElementById("coverageSection").classList.add("hidden");
        } else {
          const items = globalDB.coverages.filter(c => c.ProductID === prodId);
          items.sort((a, b) => (a.Sort || 0) - (b.Sort || 0));

          if (items.length === 0) {
            document.getElementById("coverageSection").classList.add("hidden");
          } else {
            document.getElementById("coverageSection").classList.remove("hidden");
            items.forEach(c => {
              const itemDiv = document.createElement("div");
              itemDiv.className = "flex justify-between items-start py-2 border-b border-gray-50 text-xs";
              itemDiv.innerHTML = `
                <span class="font-semibold text-gray-700 max-w-[50%]">${c.Item}</span>
                <div class="text-right">
                  <span class="block text-blue-900 font-bold">15歲以上: ${c.AdultValue || '無'}</span>
                  <span class="block text-gray-400 font-medium mt-0.5">未滿15歲: ${c.ChildValue || '無'}</span>
                </div>
              `;
              covList.appendChild(itemDiv);
            });
          }
        }

        // 2. 注意事項項目
        const noteList = document.getElementById("noticeList");
        noteList.innerHTML = "";

        if (!prodId) {
          document.getElementById("noticeSection").classList.add("hidden");
        } else {
          const notes = globalDB.notes.filter(n => n.ProductID === prodId);
          notes.sort((a, b) => (a.Sort || 0) - (b.Sort || 0));

          if (notes.length === 0) {
            document.getElementById("noticeSection").classList.add("hidden");
          } else {
            document.getElementById("noticeSection").classList.remove("hidden");
            notes.forEach(n => {
              const li = document.createElement("li");
              li.textContent = n.Content;
              noteList.appendChild(li);
            });
          }
        }
      }

      // 一鍵複製 LINE 報價單
      static copyLineQuote() {

          showToast("❌ 投保天數設定錯誤，無法複製報價單！");
          return;
        }

  ▪ 未滿15歲：${clientState.childCount} 人 (每人 ${document.getElementById("txtChildUnitPrice").textContent})

    }

    // 顯示提示彈窗
    function showToast(msg) {
      const toast = document.getElementById("toast");
      const toastMsg = document.getElementById("toastMsg");
      toastMsg.textContent = msg;
      
      toast.classList.remove("opacity-0", "scale-95", "pointer-events-none");
      toast.classList.add("opacity-100", "scale-100");

      setTimeout(() => {
        toast.classList.add("opacity-0", "scale-95", "pointer-events-none");
        toast.classList.remove("opacity-100", "scale-100");
      }, 3000);
    }
  </script>
</body>
</html>
