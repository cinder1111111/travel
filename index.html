<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>旅平險保費試算系統</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Flatpickr (極速一鍵選取日曆) CSS & JS & 繁體中文語系 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/zh-tw.js"></script>
  
  <style>
    :root {
      --primary-color: #1e40af;
      --border-radius: 12px;
      --font-family: 'Noto Sans TC', sans-serif;
      --card-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
      --footer-color: #0f172a;
    }
    body {
      font-family: var(--font-family);
      background-color: #f8fafc;
    }
    .custom-card {
      border-radius: var(--border-radius);
      box-shadow: var(--card-shadow);
    }
    .btn-primary {
      background-color: var(--primary-color);
      border-radius: var(--border-radius);
    }
    #coverageList [hidden] { display: none !important; }

    /* 桌機右側摘要、承保內容與注意事項固定於可視範圍，內部獨立捲動 */
    @media (min-width: 1024px) {
      .sidebar-scroll { scrollbar-width: thin; scrollbar-color: #cbd5e1 transparent; }
    }
    /* 隱藏原生 Chrome/Safari 等瀏覽器 input[type=number] 的小箭頭 */
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type=number] {
      -moz-appearance: textfield; /* Firefox */
    }
    /* Flatpickr 樣式自訂 - 完美契合主色 */
    .flatpickr-day.selected, .flatpickr-day.selected:hover {
      background: var(--primary-color) !important;
      border-color: var(--primary-color) !important;
    }
    .flatpickr-months .flatpickr-month {
      color: #0f172a !important;
    }
    .flatpickr-current-month .flatpickr-monthDropdown-months {
      font-weight: 700 !important;
    }

    /* 深色模式：只在 html[data-theme="dark"] 生效，原淺色版不受影響 */
    html[data-theme="dark"] { color-scheme: dark; --primary-color: #D6BD55; --footer-color: #34353A; }
    html[data-theme="dark"] body { background: #34353A !important; color: #F5F5F6 !important; }
    html[data-theme="dark"] header { background: #303136 !important; border-color: #505158 !important; }
    html[data-theme="dark"] .bg-white { background-color: #414248 !important; }
    html[data-theme="dark"] .bg-slate-50\/50,
    html[data-theme="dark"] .bg-gray-100,
    html[data-theme="dark"] .bg-gray-50\/40 { background-color: #35363C !important; }
    html[data-theme="dark"] .bg-blue-50\/50,
    html[data-theme="dark"] .bg-blue-50,
    html[data-theme="dark"] .bg-blue-100 { background-color: #4B4B43 !important; }
    html[data-theme="dark"] .border-gray-100,
    html[data-theme="dark"] .border-gray-200,
    html[data-theme="dark"] .border-slate-100,
    html[data-theme="dark"] .border-blue-100,
    html[data-theme="dark"] .border-gray-100\/50 { border-color: #505158 !important; }
    html[data-theme="dark"] .text-slate-900,
    html[data-theme="dark"] .text-gray-900,
    html[data-theme="dark"] .text-gray-950,
    html[data-theme="dark"] .text-gray-800 { color: #F5F5F6 !important; }
    html[data-theme="dark"] .text-gray-500,
    html[data-theme="dark"] .text-gray-400,
    html[data-theme="dark"] .text-gray-400\/75,
    html[data-theme="dark"] .text-slate-500,
    html[data-theme="dark"] .text-slate-400 { color: #BFC0C7 !important; }
    html[data-theme="dark"] .text-blue-700,
    html[data-theme="dark"] .text-blue-800,
    html[data-theme="dark"] .text-blue-900,
    html[data-theme="dark"] .text-blue-400 { color: #D6BD55 !important; }
    html[data-theme="dark"] input,
    html[data-theme="dark"] select,
    html[data-theme="dark"] textarea { background-color: #505159 !important; border-color: #62636A !important; color: #F5F5F6 !important; }
    html[data-theme="dark"] select option { background-color: #35363C; color: #F5F5F6; }
    html[data-theme="dark"] input::placeholder { color: #BFC0C7; }
    html[data-theme="dark"] input:focus,
    html[data-theme="dark"] select:focus { border-color: #D6BD55 !important; --tw-ring-color: rgba(214,189,85,.22) !important; }
    /* 原有的切換按鈕會由 JS 動態覆蓋 class，依選取狀態統一改為檸檬黃 */
    html[data-theme="dark"] #btnAreaOvs.bg-gradient-to-b,
    html[data-theme="dark"] #btnAreaDom.bg-gradient-to-b,
    html[data-theme="dark"] #btnDiseaseWith.bg-gradient-to-b,
    html[data-theme="dark"] #btnDiseaseWithout.bg-gradient-to-b { background: #D6BD55 !important; color: #292A2E !important; border-bottom-color: #A18B36 !important; }
    html[data-theme="dark"] .btn-primary,
    html[data-theme="dark"] button.bg-\[var\(--primary-color\)\] { background: #D6BD55 !important; color: #292A2E !important; }
    html[data-theme="dark"] .btn-primary .text-white { color: #292A2E !important; }
    html[data-theme="dark"] #daysCardContainer { background: #4B4B43 !important; border-color: #777158 !important; }
    html[data-theme="dark"] #daysCardContainer .text-blue-800,
    html[data-theme="dark"] #daysCardContainer .text-blue-900 { color: #D6BD55 !important; }
    html[data-theme="dark"] #productReminderBox { background: #4B483C !important; border-color: #7B7148 !important; }
    html[data-theme="dark"] #productReminderBox > div,
    html[data-theme="dark"] #productReminderBox > div i { color: #D6BD55 !important; }
    html[data-theme="dark"] #productReminderText { color: #E2DED1 !important; }
    html[data-theme="dark"] #announcementBanner { background: #4B483C !important; border-color: #7B7148 !important; color: #E1D08D !important; }
    html[data-theme="dark"] #announcementBanner i { color: #D6BD55 !important; }
    html[data-theme="dark"] #entryAnnouncementModal .bg-\[\#fffdfb\] { background: #414248 !important; }
    html[data-theme="dark"] #entryAnnouncementModal #entryAnnouncementContent { color: #E2DED1 !important; }
    html[data-theme="dark"] #entryAnnouncementModal #entryAnnouncementCloseButton { background: #D6BD55 !important; color: #292A2E !important; }
    html[data-theme="dark"] #entryAnnouncementModal #entryAnnouncementTitle { color: #F5F5F6 !important; }
    html[data-theme="dark"] #entryAnnouncementModal .border-slate-100 { border-color: #505158 !important; }
    html[data-theme="dark"] #noticeList { color: #BFC0C7 !important; }
    html[data-theme="dark"] #coverageList { color: #F5F5F6; }
    html[data-theme="dark"] #coverageList .bg-slate-50,
    html[data-theme="dark"] #coverageList .bg-gray-50,
    html[data-theme="dark"] #coverageList .bg-slate-50\/50 { background-color: #35363C !important; }
    html[data-theme="dark"] #coverageList .border-slate-200,
    html[data-theme="dark"] #coverageList .border-gray-200 { border-color: #505158 !important; }
    html[data-theme="dark"] #coverageList .text-slate-700,
    html[data-theme="dark"] #coverageList .text-gray-700 { color: #D8D8DD !important; }
    html[data-theme="dark"] #coverageList .text-blue-600 { color: #D6BD55 !important; }
    html[data-theme="dark"] .lg\:hidden.fixed.bottom-0 { background: #303136 !important; border-color: #505158 !important; }
    html[data-theme="dark"] #mobileTotalPremium { color: #D6BD55 !important; }
    html[data-theme="dark"] .flatpickr-calendar { background: #414248 !important; border-color: #505158 !important; box-shadow: 0 10px 32px #0008 !important; }
    html[data-theme="dark"] .flatpickr-day,
    html[data-theme="dark"] .flatpickr-weekday,
    html[data-theme="dark"] .flatpickr-current-month,
    html[data-theme="dark"] .flatpickr-months .flatpickr-month { color: #F5F5F6 !important; }
    html[data-theme="dark"] .flatpickr-day.selected,
    html[data-theme="dark"] .flatpickr-day.selected:hover { background: #D6BD55 !important; color: #292A2E !important; border-color: #D6BD55 !important; }
    html[data-theme="dark"] .flatpickr-day:hover { background: #505158 !important; }
    html[data-theme="dark"] .flatpickr-day.prevMonthDay,
    html[data-theme="dark"] .flatpickr-day.nextMonthDay { color: #999AA1 !important; }
    /* Jabra 風格：深灰面板、霧面輸入欄位與檸檬黃操作焦點 */
    html[data-theme="dark"] .bg-slate-50,
    html[data-theme="dark"] .bg-gray-50,
    html[data-theme="dark"] .bg-slate-100 { background-color: #35363C !important; }
    html[data-theme="dark"] .border-slate-200,
    html[data-theme="dark"] .border-gray-300,
    html[data-theme="dark"] .border-blue-200 { border-color: #62636A !important; }
    html[data-theme="dark"] .text-slate-700,
    html[data-theme="dark"] .text-gray-700,
    html[data-theme="dark"] .text-gray-600 { color: #D8D8DD !important; }
    html[data-theme="dark"] .text-blue-600,
    html[data-theme="dark"] .text-blue-500,
    html[data-theme="dark"] .text-blue-800 { color: #D6BD55 !important; }
    html[data-theme="dark"] .bg-blue-600,
    html[data-theme="dark"] .bg-blue-700 { background-color: #D6BD55 !important; color: #292A2E !important; }
    html[data-theme="dark"] #btnAreaOvs:not(.bg-gradient-to-b),
    html[data-theme="dark"] #btnAreaDom:not(.bg-gradient-to-b),
    html[data-theme="dark"] #btnDiseaseWith:not(.bg-gradient-to-b),
    html[data-theme="dark"] #btnDiseaseWithout:not(.bg-gradient-to-b) { background: #35363C !important; color: #D0D0D5 !important; border-color: #62636A !important; }
    html[data-theme="dark"] #btnAreaOvs.bg-gradient-to-b *,
    html[data-theme="dark"] #btnAreaDom.bg-gradient-to-b *,
    html[data-theme="dark"] #btnDiseaseWith.bg-gradient-to-b *,
    html[data-theme="dark"] #btnDiseaseWithout.bg-gradient-to-b * { color: #292A2E !important; }
    html[data-theme="dark"] .flatpickr-months .flatpickr-month { background: #414248 !important; }
    html[data-theme="dark"] .flatpickr-current-month .flatpickr-monthDropdown-months { color: #F5F5F6 !important; }
    html[data-theme="dark"] .flatpickr-time input { color: #F5F5F6 !important; }
    html[data-theme="dark"] .flatpickr-day.today:not(.selected) { border-color: #D6BD55 !important; }
    /* 切換鈕只新增於導覽列，淺色模式沿用既有視覺 */
    #themeToggle { display: inline-flex; align-items: center; gap: 6px; padding: 7px 10px; border: 1px solid #E2E8F0; border-radius: 999px; background: #FFF; color: #334155; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap; }
    #themeToggle:hover { background: #F1F5F9; }
    html[data-theme="dark"] #themeToggle { background: #35363C; border-color: #62636A; color: #D6BD55; }
    html[data-theme="dark"] #themeToggle:hover { background: #505158; }
    @media (max-width: 480px) { #themeToggle { padding: 7px; } #themeToggleLabel { display: none; } }
    /* 承保內容展開列：深灰底、白字與柔霧芥末黃操作提示，避免淺灰底黃色字對比不足 */
    html[data-theme="dark"] #coverageList section > div:first-child {
      background: #35363C !important;
      border-color: #5C5D64 !important;
    }
    html[data-theme="dark"] #coverageList section > div:first-child h4 {
      color: #F5F5F6 !important;
    }
    html[data-theme="dark"] #coverageList section > div:first-child button {
      color: #D6BD55 !important;
    }
    html[data-theme="dark"] #coverageList section > div:first-child button:hover {
      color: #E5D38C !important;
    }
    html[data-theme="dark"] #coverageList section > div:first-child .bg-blue-700 {
      background: #D6BD55 !important;
    }
    /* 修正動態建立的承保展開標題：原 bg-slate-100/80 未被深色規則覆蓋 */
    html[data-theme="dark"] #coverageList section > .bg-slate-100\/80 {
      background-color: #35363C !important;
      border-color: #5C5D64 !important;
    }
    html[data-theme="dark"] #coverageList section > .bg-slate-100\/80 h4 {
      color: #F5F5F6 !important;
    }
    html[data-theme="dark"] #coverageList section > .bg-slate-100\/80 button {
      color: #D6BD55 !important;
    }
    /* 承保明細金額與左側險種名稱使用相同灰白色 */
    html[data-theme="dark"] #coverageList section [id^="coverage-rows-"] .text-blue-900 {
      color: #D8D8DD !important;
    }
    /* 僅深色模式：承保明細左側險種名稱與「展開／關閉」文字同色 */
    html[data-theme="dark"] #coverageList [id^="coverage-rows-"] > div > span:first-child {
      color: #D6BD55 !important;
    }
    /* 僅深色模式：LINE 報價按鈕改為柔和淺黃 */
    html[data-theme="dark"] #copyLineQuoteButton {
      background: #E8D98A !important;
      color: #292A2E !important;
    }
    html[data-theme="dark"] #copyLineQuoteButton:hover {
      background: #EFE1A1 !important;
    }
    /* 僅深色模式：承保金額顏色與險種名稱一致，維持粗體 */
    html[data-theme="dark"] #coverageList [id^="coverage-rows-"] > div > span:last-child {
      color: #D8D8DD !important;
      font-weight: 700 !important;
    }
    /* 方案提醒與天數區塊收斂底色，避免黃色面積過大 */
    html[data-theme="dark"] #daysCardContainer { background: #3B3C40 !important; border-color: #77704E !important; }
    html[data-theme="dark"] #productReminderBox { background: #3C3D40 !important; border-color: #756D4B !important; }
  
    /* 簡潔標題：無 ICON、無左側色線，僅以灰色底線建立區塊層次 */
    .section-heading-v2 {
      display: block;
      padding-bottom: 12px;
      margin-bottom: 14px;
      border-bottom: 1px solid #E2E6EC;
      font-size: 1.125rem;
      line-height: 1.5rem;
      font-weight: 700;
      color: #001C54;
    }
    /* 保險期間欄位標題與主區塊標題同色，保留原本字級及間距 */
    html:not([data-theme="dark"]) .period-heading-navy { color: #001C54; }
    html[data-theme="dark"] .period-heading-navy { color: #E2E5EF !important; }
    html[data-theme="dark"] .section-heading-v2 {
      color: #E2E5EF;
      border-bottom-color: #56575E;
    }

    /* 試算摘要：三列使用一致的左右欄格線，右側數值共用同一個右邊界。 */
    .quote-summary-row { display: grid; grid-template-columns: max-content minmax(0, 1fr); column-gap: 0.75rem; align-items: start; }
    .quote-summary-row > :last-child { justify-self: end; text-align: right; min-width: 0; overflow-wrap: anywhere; }
  </style>
</head>
<body class="text-gray-800 antialiased min-h-screen flex flex-col pb-36 lg:pb-6">

  <!-- 系統公告卡片 (依試算表動態控制) - 降低高度優雅收縮 -->
  <div id="announcementBanner" class="hidden bg-amber-50 border-b border-amber-200 py-2 px-4 text-center text-amber-900 text-sm md:text-base font-bold flex items-center justify-center gap-2">
    <i data-lucide="megaphone" class="w-5 h-5 text-amber-600 flex-shrink-0"></i>
    <span id="announcementText"></span>
  </div>

  <!-- 頂部導覽列 -->
  <header class="bg-white border-b border-gray-100 py-4 px-6 sticky top-0 z-40 shadow-sm">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-2.5">
        <i data-lucide="shield-check" class="w-7 h-7 text-blue-700"></i>
        <h1 id="siteTitle" class="text-xl md:text-2xl font-bold text-gray-900">旅平險保費試算</h1>
      </div>
      <div class="text-right flex items-center justify-end gap-2">
        <button id="themeToggle" type="button" onclick="toggleTheme()" aria-label="切換深色模式" aria-pressed="false" title="切換深色／淺色模式">
          <i id="themeToggleIcon" data-lucide="moon" class="w-4 h-4"></i>
          <span id="themeToggleLabel">深色模式</span>
        </button>
        <!-- 降低存在感的日期標籤 -->
        <span id="effectiveDate" class="text-xs md:text-sm text-gray-400/75 bg-gray-50/40 border border-gray-100/50 px-3 py-1 rounded-full font-medium">適用載入中...</span>
      </div>
    </div>
  </header>

  <!-- 進站公告彈出視窗：由控制台 AnnouncementEnabled 與文案設定 -->
  <div id="entryAnnouncementModal" class="hidden fixed inset-0 z-[70] flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="entryAnnouncementTitle" aria-describedby="entryAnnouncementContent">
    <div class="absolute inset-0 bg-slate-950/60" aria-hidden="true"></div>
    <div class="relative w-full max-w-lg rounded-2xl bg-[#fffdfb] shadow-2xl overflow-hidden">
      <div class="flex items-start justify-between gap-4 px-6 pt-6 pb-3">
        <div class="flex items-center gap-3 min-w-0">
          <div class="w-10 h-10 flex-shrink-0 rounded-xl bg-orange-50 text-[#d66e58] flex items-center justify-center"><i data-lucide="megaphone" class="w-5 h-5"></i></div>
          <h2 id="entryAnnouncementTitle" class="text-xl font-bold text-slate-900 break-words">重要公告</h2>
        </div>
        <button id="entryAnnouncementCloseX" type="button" onclick="closeEntryAnnouncement()" aria-label="關閉公告" class="flex-shrink-0 rounded-lg p-2 text-slate-500 hover:bg-orange-50 hover:text-[#d66e58] focus:outline-none focus:ring-2 focus:ring-[#d66e58]"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <div id="entryAnnouncementContent" class="px-6 py-4 text-base leading-7 text-slate-700 whitespace-pre-wrap break-words max-h-[55vh] overflow-y-auto"></div>
      <div class="px-6 pb-6 pt-3 border-t border-slate-100">
        <button id="entryAnnouncementCloseButton" type="button" onclick="closeEntryAnnouncement()" class="w-full py-3 text-white font-bold rounded-xl bg-[#d66e58] hover:bg-[#c65e49] shadow-md transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#d66e58]">關閉</button>
      </div>
    </div>
  </div>

  <!-- 系統維護畫面 -->
  <div id="maintenanceScreen" class="hidden fixed inset-0 bg-white z-50 flex flex-col items-center justify-center p-6 text-center">
    <div class="w-16 h-16 bg-red-50 text-red-600 rounded-full flex items-center justify-center mb-4">
      <i data-lucide="alert-triangle" class="w-8 h-8"></i>
    </div>
    <h2 class="text-2xl font-bold text-gray-900 mb-2">目前系統維護中</h2>
    <p class="text-gray-500 max-w-md">我們正在更新費率與系統設定，請稍後再試。造成不便敬請見諒。</p>
  </div>

  <!-- 主內容區域：卡片外框全面對齊間距 (統一 space-y-4) -->
  <main class="flex-grow max-w-7xl w-full mx-auto p-4 md:p-6 lg:p-8 grid grid-cols-1 lg:grid-cols-12 gap-4 items-start">
    
    <!-- 左側：輸入表單 (佔 7 格，統一間距 space-y-4) -->
    <div class="lg:col-span-7 space-y-4">
      
      <!-- 1. 旅遊地區 (灰色底層 w-full 滿版，藍色立體按鈕加長 1.5 倍) -->
      <div class="bg-white p-5 rounded-xl border border-gray-100 custom-card">
        <label id="lblTravelArea" class="section-heading-v2">旅遊地區</label>
        <div class="flex bg-gray-100 p-1.5 rounded-xl w-full">
          <div class="flex-1 flex justify-center items-center">
            <button id="btnAreaOvs" class="w-[88%] py-3 text-base font-extrabold rounded-lg text-center transition-all focus:outline-none cursor-pointer" onclick="AppController.setArea('overseas')">
              海外旅遊
            </button>
          </div>
          <div class="flex-1 flex justify-center items-center">
            <button id="btnAreaDom" class="w-[88%] py-3 text-base font-extrabold rounded-lg text-center text-gray-500 hover:text-gray-900 border-b-[3px] border-transparent transition-all focus:outline-none cursor-pointer" onclick="AppController.setArea('domestic')">
              國內旅遊
            </button>
          </div>
        </div>
      </div>

      <!-- 2. 保險期間 -->
      <div class="bg-white p-5 rounded-xl border border-gray-100 custom-card">
        <div class="grid grid-cols-2 gap-4">
          <!-- 左半邊：保險生效日 -->
          <div class="space-y-2">
            <label class="period-heading-navy block text-base font-bold text-slate-900">保險生效日</label>
            <input type="text" id="startDate" class="w-full h-12 px-4 border border-gray-200 rounded-lg text-base font-bold text-gray-900 bg-white focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 outline-none transition cursor-pointer" placeholder="選擇日期" readonly>
            <div class="relative">

  <!-- 成功提示 Toast 訊息 -->
  <div id="toast" class="fixed top-24 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white px-4 py-2.5 rounded-full text-xs font-semibold shadow-xl opacity-0 scale-95 pointer-events-none transition-all duration-300 z-50 flex items-center gap-1.5">
    <i data-lucide="check-circle" class="w-4 h-4 text-emerald-400"></i>
    <span id="toastMsg">複製成功！</span>

  <!-- JS 邏輯區 -->
  <script>

    // 使用者深淺色偏好：localStorage 記住上次選擇；無法儲存時仍可在當次頁面切換。
    const THEME_STORAGE_KEY = 'TRAVEL_INS_THEME_V1';
    function setTheme(theme, persist = true) {
      const next = theme === 'dark' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', next);
      const label = document.getElementById('themeToggleLabel');
      const button = document.getElementById('themeToggle');
      const icon = document.getElementById('themeToggleIcon');
      if (label) label.textContent = next === 'dark' ? '淺色模式' : '深色模式';
      if (button) {
        button.setAttribute('aria-pressed', String(next === 'dark'));
        button.setAttribute('aria-label', next === 'dark' ? '切換為淺色模式' : '切換為深色模式');
      }
      if (icon) icon.setAttribute('data-lucide', next === 'dark' ? 'sun' : 'moon');
      if (typeof lucide !== 'undefined') lucide.createIcons();
      if (persist) {
        try { localStorage.setItem(THEME_STORAGE_KEY, next); }
        catch (e) { console.warn('瀏覽器未允許儲存主題偏好', e); }
      }
    }
    function toggleTheme() {
      setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    }
    (function restoreTheme() {
      let saved = 'light';
      try { saved = localStorage.getItem(THEME_STORAGE_KEY) || 'light'; }
      catch (e) { /* 無儲存權限時預設淺色 */ }
      setTheme(saved, false);
    })();

    // 串接使用者部署好的 Google Apps Script 雲端 API 網址 (大人小孩獨立Sheet分流架構)
    const GOOGLE_APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzCudyI5uo1lDZXVsUfTxZrfzeLrLLzUh70N38HWLcAsn75-22G44cZ5ijzmyH86MJx/exec";
    const CACHE_KEY = "TRAVEL_INS_CACHE_V8";
    const CACHE_TIME_KEY = "TRAVEL_INS_CACHE_TIME_V8";
    const CACHE_DURATION_MS = 5 * 60 * 1000; // 5 分鐘快取

    // 全域資料儲存庫 - 與後端分流 Schema 完全一致
    let globalDB = {
      control: {},
      products: [],
      adultProductOptions: [],
      childProductOptions: [],
      adultRates: [],
      childRates: [],
      adultCoverages: [],
      childCoverages: [],
      coverageRules: [],
      notes: [],
      ui: {},
      texts: {}
    };

    // 前台操作狀態 management
    let clientState = {
      area: 'overseas',          // 'domestic' | 'overseas'
      diseaseOption: true,      // true (含法傳) | false (不含)
      selectedProductId: '',     // 當前方案編號
      startDate: '',
      startHour: 10,
      endDate: '',
      endHour: 10,
      days: 1,
      adultDeath: '',
      childDeath: '',
      medical: '',
      adultCount: 1,
      childCount: 0
    };

    // Flatpickr 控制物件
    let startPickerInstance = null;
    let endPickerInstance = null;

    // 系統初始化入口
    window.onload = async function() {
      initHourSelectors();
      initCalendarAndDates();
      await loadDatabase();
      lucide.createIcons();
    };

    // 生成小時選項
    function initHourSelectors() {
      const startSel = document.getElementById("startHour");
      const endSel = document.getElementById("endHour");
      for (let i = 1; i <= 24; i++) {
        const optStart = document.createElement("option");
        optStart.value = i;
        optStart.textContent = `${i} 時`;
        startSel.appendChild(optStart);

        const optEnd = document.createElement("option");
        optEnd.value = i;
        optEnd.textContent = `${i} 時`;
        endSel.appendChild(optEnd);
      }
      startSel.value = 10;
      endSel.value = 10;
    }

    // 初始化 Flatpickr 與預設日期設定
    function initCalendarAndDates() {
      const today = new Date();
      const tomorrow = new Date();
      tomorrow.setDate(today.getDate() + 1);

      const toDateString = (d) => {
        const year = d.getFullYear();
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${year}/${month}/${day}`;
      };

      const todayStr = toDateString(today);
      const tomorrowStr = toDateString(tomorrow);

      clientState.startDate = todayStr;
      clientState.endDate = tomorrowStr;

      // 生效日日曆初始化
      startPickerInstance = flatpickr("#startDate", {
        locale: "zh_tw",
        dateFormat: "Y/m/d",
        defaultDate: todayStr,
        disableMobile: "true",
        onChange: function(selectedDates, dateStr) {
          clientState.startDate = dateStr;
          AppController.onPeriodChange();
        }
      });

      // 結束日日曆初始化
      endPickerInstance = flatpickr("#endDate", {
        locale: "zh_tw",
        dateFormat: "Y/m/d",
        defaultDate: tomorrowStr,
        disableMobile: "true",
        onChange: function(selectedDates, dateStr) {
          clientState.endDate = dateStr;
          AppController.onPeriodChange();
        }
      });
    }

    // 載入資料庫：快取失敗不影響 API，API 失敗時才使用可解析的離線快取。
    async function loadDatabase() {
      let cacheData = null;
      let cacheTime = null;
      const now = Date.now();
      try {
        cacheData = localStorage.getItem(CACHE_KEY);
        cacheTime = localStorage.getItem(CACHE_TIME_KEY);
      } catch (storageError) {
        console.warn("瀏覽器無法讀取本機快取，將直接連線 API", storageError);
      }

      if (cacheData && cacheTime && now - Number(cacheTime) < CACHE_DURATION_MS) {
        try {
          const cached = JSON.parse(cacheData);
          if (!cached || !cached.control || !Array.isArray(cached.products)) throw new Error('快取資料結構不完整');
          globalDB = cached;
          applyDBData();
          return;
        } catch (cacheError) {
          console.warn("快取資料無效，改從 API 載入", cacheError);
        }
      }

      let data;
      try {
        const response = await fetch(GOOGLE_APPS_SCRIPT_URL, { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP 錯誤: ${response.status}`);
        data = await response.json();
        if (data.error) throw new Error(String(data.error));
        if (!data.control || !Array.isArray(data.products)) throw new Error('API 回傳資料結構不完整');
      } catch (apiError) {
        console.error("雲端 API 讀取失敗", apiError);
        if (cacheData) {
          try {
            const cached = JSON.parse(cacheData);
            if (!cached || !cached.control || !Array.isArray(cached.products)) throw new Error('離線快取資料結構不完整');
            globalDB = cached;
            applyDBData();
            showToast("⚠️ API 讀取失敗，改採離線快取資料");
            return;
          } catch (cacheError) {
            console.error("離線快取無法使用", cacheError);
          }
        }
        document.getElementById("maintenanceScreen").classList.remove("hidden");
        return;
      }

      globalDB = data;
      // localStorage 可能因手機私密瀏覽、空間不足而拒絕寫入，不應誤判為 API 故障。
      try {
        localStorage.setItem(CACHE_KEY, JSON.stringify(data));
        localStorage.setItem(CACHE_TIME_KEY, String(now));
      } catch (storageError) {
        console.warn("API 已成功載入，但本機快取寫入失敗", storageError);
      }
      applyDBData();
    }

    // 進站公告：控制台 AnnouncementEnabled = TRUE 時，載入資料後彈出一次。
    // 公告文字以 textContent 顯示，避免試算表文字被當成 HTML 執行。
    let entryAnnouncementOpened = false;
    let entryAnnouncementPreviousFocus = null;
    function applyEntryAnnouncement() {
      if (entryAnnouncementOpened) return;
      const enabled = globalDB.control && /^(true|1|yes|on)$/i.test(String(globalDB.control.AnnouncementEnabled ?? '').trim());
      if (!enabled) return;
      const title = String(globalDB.control?.AnnouncementTitle ?? '重要公告').trim() || '重要公告';
      const content = String(globalDB.control?.AnnouncementContent ?? '').trim();
      if (!content) return;
      document.getElementById('entryAnnouncementTitle').textContent = title;
      document.getElementById('entryAnnouncementContent').textContent = content;
      entryAnnouncementPreviousFocus = document.activeElement;
      entryAnnouncementOpened = true;
      document.getElementById('entryAnnouncementModal').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
      document.getElementById('entryAnnouncementCloseX').focus();
    }
    function closeEntryAnnouncement() {
      document.getElementById('entryAnnouncementModal').classList.add('hidden');
      document.body.style.overflow = '';
      if (entryAnnouncementPreviousFocus && typeof entryAnnouncementPreviousFocus.focus === 'function') entryAnnouncementPreviousFocus.focus();
    }
    document.addEventListener('keydown', function(e) {
      const modal = document.getElementById('entryAnnouncementModal');
      if (!modal || modal.classList.contains('hidden')) return;
      if (e.key === 'Escape') { closeEntryAnnouncement(); return; }
      if (e.key === 'Tab') {
        const controls = [document.getElementById('entryAnnouncementCloseX'), document.getElementById('entryAnnouncementCloseButton')];
        if (e.shiftKey && document.activeElement === controls[0]) { e.preventDefault(); controls[1].focus(); }
        else if (!e.shiftKey && document.activeElement === controls[1]) { e.preventDefault(); controls[0].focus(); }
      }
    });

      // 依地區與法傳篩選商品
      static updateProducts() {
        const selectEl = document.getElementById("selProduct");
        if (!selectEl) return;
        selectEl.innerHTML = "";

        const filtered = globalDB.products.filter(p => {
          if (!p.Enable) return false;
          if (p.Area !== clientState.area) return false;
          if (clientState.area === 'overseas') {
            const pOpt = (p.DiseaseOption || "").toString().trim();
            if (clientState.diseaseOption) {
              return pOpt.includes("含") && !pOpt.includes("不含");
            } else {
              return pOpt.includes("不含") || pOpt === "" || pOpt === "無" || !p.DiseaseOption;
            }
          }
          return true;
        });

        filtered.sort((a, b) => (a.Sort || 0) - (b.Sort || 0));

        if (filtered.length === 0) {
          const opt = document.createElement("option");
          opt.value = ""; opt.textContent = "無符合之方案計畫";
          selectEl.appendChild(opt);
          clientState.selectedProductId = "";
          this.updateProductOptions();
          return;
        }

        filtered.forEach((prod) => {
          const opt = document.createElement("option");
          opt.value = prod.ProductID;
          // 下拉選單只顯示商品方案名稱，法傳資訊由上方獨立選項控制。
          opt.textContent = prod.ProductName;
          selectEl.appendChild(opt);
        });

        const hasMatch = filtered.some(p => p.ProductID === clientState.selectedProductId);
        if (!hasMatch && filtered.length > 0) {
          clientState.selectedProductId = filtered[0].ProductID;

      static updateProductOptions() {
        this.updateProductReminder();
        const prodId = clientState.selectedProductId;
        const selAdult = document.getElementById("selAdultDeath");
        const selChild = document.getElementById("selChildDeath");
        const selMedical = document.getElementById("selMedical");

        selAdult.innerHTML = "";
        selChild.innerHTML = "";
        selMedical.innerHTML = "";

        // 分別讀取大人小孩分流之商品選項
        const adultOptions = (globalDB.adultProductOptions || []).filter(o => o.ProductID === prodId && o.Enable);

        const medicals = [...new Set(adultOptions.map(o => o.Medical)
          .filter(v => v !== null && v !== undefined && String(v).trim() !== '')
          .map(v => String(v).trim()))];

        // 小孩失能保額選項：對應 Google Sheet CHILD_DISABILITY 欄位
        const childDisabilities = [...new Set(childOptions.map(o => o.CHILD_DISABILITY))].filter(Boolean);

          selMedical.appendChild(opt);

      // 天數無條件進位運算
      static calculateDays() {
        const startVal = clientState.startDate;
        const endVal = clientState.endDate;
        const startH = clientState.startHour;
        const endH = clientState.endHour;

        const daysCard = document.getElementById("daysCardContainer");
        const warningContainer = document.getElementById("daysWarningContainer");

        if (!startVal || !endVal) {
          clientState.days = 1;
          this.updateDaysUI();
          return;
        }

        const formatISO = (s) => s.replace(/\//g, '-');
        const startDateTime = new Date(`${formatISO(startVal)}T${String(startH).padStart(2, '0')}:00:00`);
        const endDateTime = new Date(`${formatISO(endVal)}T${String(endH).padStart(2, '0')}:00:00`);

        let errorMsg = "";

        if (startDateTime > endDateTime) {
          errorMsg = "保險生效日不可晚於結束日！";
        } else {
          const diffMs = endDateTime.getTime() - startDateTime.getTime();
          const diffHours = diffMs / (1000 * 60 * 60);
          let calculatedDays = Math.ceil(diffHours / 24);

          if (calculatedDays <= 0) calculatedDays = 1;

          if (clientState.area === 'domestic' && calculatedDays > 14) {
            errorMsg = `國內旅遊投保天數最多 14 天！(目前 ${calculatedDays} 天)`;
          } else if (clientState.area === 'overseas' && calculatedDays > 180) {
            errorMsg = `海外旅遊投保天數最多 180 天！(目前 ${calculatedDays} 天)`;
          }

          clientState.days = calculatedDays;
        }

        if (errorMsg) {
          daysCard.className = "col-span-2 bg-red-50 border-2 border-red-500 p-3.5 rounded-lg flex flex-col gap-1 transition-all duration-200 shadow-sm";
          warningContainer.className = "text-xs md:text-sm font-black text-red-600 flex items-center gap-1 mt-1";
          warningContainer.innerHTML = `<i data-lucide="alert-triangle" class="w-4 h-4 text-red-600 flex-shrink-0"></i><span>${errorMsg}</span>`;
          warningContainer.classList.remove("hidden");
          lucide.createIcons();

          clientState.days = 0; 
          this.updateDaysUI(true);
        } else {
          daysCard.className = "col-span-2 bg-blue-50/50 border border-blue-100 p-3.5 rounded-lg flex flex-col gap-1 transition-all";
          warningContainer.classList.add("hidden");
          warningContainer.innerHTML = "";

          this.updateDaysUI(false);
        }
      }

      // 計算總保費 (分流大人小孩獨立費率 Sheet)
      static calculatePremium() {
        const prodId = clientState.selectedProductId;
        const days = clientState.days;
        const adDeath = clientState.adultDeath;
        const chDeath = clientState.childDeath;
        const med = clientState.medical;

        let adultPrice = 0;
        let childPrice = 0;

        if (days > 0 && prodId) {
          // 1. 查大人獨立費率
          const adultRateRecord = (globalDB.adultRates || []).find(r => 
            r.ProductID === prodId &&
            parseInt(r.Days) === parseInt(days) &&
            r.Death === adDeath &&
            String(r.Medical ?? '').trim() === String(med ?? '').trim()
          );

          // 2. 查小孩獨立費率：對應 Google Sheet CHILD_DISABILITY 欄位
          const childRateRecord = (globalDB.childRates || []).find(r => 
            r.ProductID === prodId &&
            parseInt(r.Days) === parseInt(days) &&
            r.CHILD_DISABILITY === chDeath &&
            String(r.Medical ?? '').trim() === String(med ?? '').trim()  // 加入醫療選項比對
          );

          if (adultRateRecord) {
            adultPrice = parseInt(adultRateRecord.Premium) || 0;
            document.getElementById("txtAdultUnitPrice").textContent = `NT$ ${adultPrice.toLocaleString()}`;
          } else {
            document.getElementById("txtAdultUnitPrice").textContent = "無費率";
          }

          if (childRateRecord) {
            childPrice = parseInt(childRateRecord.Premium) || 0;
            document.getElementById("txtChildUnitPrice").textContent = `NT$ ${childPrice.toLocaleString()}`;
          } else {
            document.getElementById("txtChildUnitPrice").textContent = "無費率";
          }
        } else {
          document.getElementById("txtAdultUnitPrice").textContent = "$-";
          document.getElementById("txtChildUnitPrice").textContent = "$-";
        }

        const total = (adultPrice * clientState.adultCount) + (childPrice * clientState.childCount);

        const displayTotal = days > 0 ? total.toLocaleString() : "--";
        document.getElementById("desktopTotalPremium").textContent = displayTotal;
        document.getElementById("mobileTotalPremium").textContent = displayTotal;

        const curProd = globalDB.products.find(p => p.ProductID === prodId);
        const prodName = curProd ? curProd.ProductName : '-';
        // 摘要顯示完整方案資訊；海外方案附加法定傳染病選項。
        const diseaseTag = curProd && clientState.area === 'overseas'
          ? String(curProd.DiseaseOption || (clientState.diseaseOption ? '含法定傳染病' : '不含法定傳染病')).trim()
          : '';
        const summaryName = diseaseTag ? `${prodName}（${diseaseTag}）` : prodName;
        
        const summaryProdEl = document.getElementById("summaryProduct");
        if (summaryProdEl) {
          summaryProdEl.textContent = summaryName;
        }

        this.updateSummaryPeople();
      }

      // 保額字串轉成「元」：支援 200萬、200萬元、NT$ 2,000,000、2000000
      static parseAmount(value) {
        if (typeof value === 'number') return Number.isFinite(value) ? value : NaN;
        const raw = String(value ?? '').trim().replace(/[，,\s]/g, '').replace(/NT\$|新臺幣|新台幣|元/g, '');
        const match = raw.match(/^([0-9]+(?:\.[0-9]+)?)(萬|億)?$/);
        if (!match) return NaN;
        const factor = match[2] === '億' ? 100000000 : match[2] === '萬' ? 10000 : 1;
        return Number(match[1]) * factor;
      }

      static formatCoverageAmount(amount) {
        if (!Number.isFinite(amount) || amount < 0) return '資料設定錯誤';
        if (amount >= 10000 && amount % 10000 === 0) return `${(amount / 10000).toLocaleString('zh-TW')}萬元`;
        return `${amount.toLocaleString('zh-TW', { maximumFractionDigits: 2 })}元`;
      }

      // 固定承保內容僅統一數字的千分位格式，不變更原有單位與文字。
      static formatFixedCoverageValue(value) {
        const raw = String(value ?? '').trim();
        if (!raw) return '未設定';
        // 支援 1500、1,500、1500元、100萬、100萬元、NT$ 30000 等原始資料。
        // 只格式化獨立數字，保留既有「萬／元」及其他文字，不擅自換算單位。
        return raw.replace(/(^|[^\d.,])(-?\d[\d,]*(?:\.\d+)?)(?=($|[^\d.,]))/g,
          (full, prefix, numberText) => {
            const normalized = numberText.replace(/,/g, '');
            const parts = normalized.split('.');
            parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
            return prefix + parts.join('.');
          });
      }

      // FIXED 統一格式化；LINK 依規則表計算
      static resolveCoverageValue(coverage, group) {
        const type = String(coverage.Type || 'FIXED').trim().toUpperCase();
        if (type !== 'LINK') return this.formatFixedCoverageValue(coverage.Value);

        const ruleId = String(coverage.RuleID || '').trim();
        const rule = (globalDB.coverageRules || []).find(r => String(r.RuleID || '').trim() === ruleId);
        if (!rule) return '規則未設定';

        const source = String(rule.Source || '').trim().toUpperCase();

        // 同一張保單共用醫療選項；比例依大人身故／小孩失能保額分別計算。
        // 0、3萬、150萬屬固定金額；5%、10%屬比例連動。
        if (source === 'MEDICAL_OPTION') {
          // 支援 Google Sheet 的「身故5%」「身故10%」「失能5%」「失能10%」
          // 以及「5%」「10%」「0」「3萬」「150萬」；不改動原始選項值，避免影響費率比對。
          const option = String(clientState.medical ?? '')
            .trim().replace(/％/g, '%').replace(/\s/g, '');
          const percentMatch = option.match(/^(?:(?:身故|失能)(?:保額)?)?(\d+(?:\.\d+)?)%$/);
          let amount;
          if (percentMatch) {
            const baseText = group === 'child' ? clientState.childDeath : clientState.adultDeath;
            const base = this.parseAmount(baseText);
            if (!Number.isFinite(base)) return '醫療計算基準錯誤';
            amount = base * Number(percentMatch[1]) / 100;
          } else {
            amount = this.parseAmount(option);
            if (!Number.isFinite(amount)) return '醫療選項設定錯誤';
          }
          // 醫療基準金額可再依規則倍率分配：住院 1、門診 0.03、急診 0.1。
          // 空白倍率視為 1，兼容原本的 R02 規則。
          const multiplierText = String(rule.Multiplier ?? '').trim().replace(/％/g, '%');
          if (multiplierText !== '') {
            const isPercent = multiplierText.endsWith('%');
            const numericText = isPercent ? multiplierText.slice(0, -1) : multiplierText;
            const multiplier = Number(numericText);
            if (numericText.trim() === '' || !Number.isFinite(multiplier) || multiplier < 0) {
              return '倍率設定錯誤';
            }
            amount *= isPercent ? multiplier / 100 : multiplier;
          }
          // 先套用倍率，再檢查承保上限。
          if (String(rule.Cap ?? '').trim() !== '') {
            const cap = this.parseAmount(rule.Cap);
            if (!Number.isFinite(cap)) return '上限設定錯誤';
            amount = Math.min(amount, cap);
          }
          return this.formatCoverageAmount(amount);
        }

        let sourceValue;
        switch (source) {
          case 'DEATH': sourceValue = clientState.adultDeath; break;
          case 'CHILD_DISABILITY': sourceValue = clientState.childDeath; break;
          case 'MEDICAL': sourceValue = clientState.medical; break;
          default: return '來源設定錯誤';
        }
        const base = this.parseAmount(sourceValue);
        const multiplier = Number(String(rule.Multiplier ?? '').replace('%', ''));
        const factor = String(rule.Multiplier ?? '').includes('%') ? multiplier / 100 : multiplier;
        if (!Number.isFinite(base) || !Number.isFinite(factor) || String(rule.Multiplier ?? '').trim() === '') {
          return '連動資料不完整';
        }
        let amount = base * factor;
        if (String(rule.Cap ?? '').trim() !== '') {
          const cap = this.parseAmount(rule.Cap);
          if (!Number.isFinite(cap)) return '上限設定錯誤';
          amount = Math.min(amount, cap);
        }
        return this.formatCoverageAmount(amount);
      }

      // 承保內容展開狀態：大人、小孩獨立控制；資料重新渲染時保留選擇。
      static coverageExpanded = { adult: false, child: false };

      // 依實際投保人數與商品讀取大人／小孩承保內容
      static syncDynamicSections() {
        const prodId = clientState.selectedProductId;
        const covList = document.getElementById('coverageList');
        const coverageSection = document.getElementById('coverageSection');
        covList.replaceChildren();

        const adultItems = clientState.adultCount > 0
          ? (globalDB.adultCoverages || []).filter(c => c.ProductID === prodId) : [];
        const childItems = clientState.childCount > 0
          ? (globalDB.childCoverages || []).filter(c => c.ProductID === prodId) : [];

        // 大人與小孩分區顯示，分別依各自的 Sort 排序，不合併相同 Item。
        const hasCoverages = adultItems.length > 0 || childItems.length > 0;
        coverageSection.classList.toggle('hidden', !prodId || !hasCoverages);

        const renderGroup = (heading, records, group) => {
          if (!records.length) return;
          const section = document.createElement('section');
          section.className = 'rounded-xl border border-slate-200 bg-slate-50/50 overflow-hidden';

          const expanded = this.coverageExpanded[group] === true;
          const header = document.createElement('div');
          header.className = 'flex items-center justify-between gap-2 px-4 py-3 bg-slate-100/80' + (expanded ? ' border-b border-slate-200' : '');
          const headingBox = document.createElement('div');
          headingBox.className = 'flex items-center gap-2 min-w-0';
          const marker = document.createElement('span');
          marker.className = 'inline-block w-1 h-4 rounded-full bg-blue-700 flex-shrink-0';
          const label = document.createElement('h4');
          label.className = 'font-black text-sm text-slate-800';
          label.textContent = heading;
          headingBox.append(marker, label);

          const toggle = document.createElement('button');
          toggle.type = 'button';
          toggle.className = 'flex-shrink-0 text-sm font-bold text-blue-800 hover:text-blue-600 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 rounded px-2 py-1';
          toggle.textContent = expanded ? '關閉 −' : '展開 +';
          toggle.setAttribute('aria-expanded', String(expanded));
          toggle.setAttribute('aria-label', `${heading}${expanded ? '關閉' : '展開'}`);
          const rowsId = `coverage-rows-${group}`;
          toggle.setAttribute('aria-controls', rowsId);
          header.append(headingBox, toggle);
          section.appendChild(header);

          const rows = document.createElement('div');
          rows.className = 'px-4 py-1 bg-white';
          rows.id = rowsId;
          rows.hidden = !expanded;
          toggle.addEventListener('click', () => {
            const isExpanded = !this.coverageExpanded[group];
            this.coverageExpanded[group] = isExpanded;
            rows.hidden = !isExpanded;
            header.classList.toggle('border-b', isExpanded);
            header.classList.toggle('border-slate-200', isExpanded);
            toggle.textContent = isExpanded ? '關閉 −' : '展開 +';
            toggle.setAttribute('aria-expanded', String(isExpanded));
            toggle.setAttribute('aria-label', `${heading}${isExpanded ? '關閉' : '展開'}`);
          });
          const sorted = [...records].sort((a, b) => (Number(a.Sort) || 9999) - (Number(b.Sort) || 9999));
          for (const record of sorted) {
            const item = String(record.Item || '').trim();
            if (!item) continue;
            const row = document.createElement('div');
            row.className = 'flex justify-between items-start gap-3 py-3 border-b border-gray-100 last:border-b-0 text-sm';
            const title = document.createElement('span');
            title.className = 'font-semibold text-gray-700 flex-1 min-w-0';
            title.textContent = item;
            const value = document.createElement('span');
            value.className = 'font-extrabold text-blue-900 text-right shrink-0 max-w-[48%] break-words';
            value.textContent = this.resolveCoverageValue(record, group);
            row.append(title, value);
            rows.appendChild(row);
          }
          section.appendChild(rows);
          covList.appendChild(section);
        };

        covList.className = 'space-y-4';
        if (clientState.adultCount > 0) renderGroup('15歲以上承保內容', adultItems, 'adult');
        if (clientState.childCount > 0) renderGroup('未滿15歲承保內容', childItems, 'child');

        // 注意事項項目
        const noteList = document.getElementById("noticeList");
        noteList.innerHTML = "";

        if (!prodId) {
          document.getElementById("noticeSection").classList.add("hidden");
        } else {
          const notes = globalDB.notes.filter(n => n.ProductID === prodId);
          notes.sort((a, b) => (a.Sort || 0) - (b.Sort || 0));

          if (notes.length === 0) {
            document.getElementById("noticeSection").classList.add("hidden");
          } else {
            document.getElementById("noticeSection").classList.remove("hidden");
            notes.forEach(n => {
              const li = document.createElement("li");
              li.textContent = n.Content;
              noteList.appendChild(li);
            });
          }
        }
      }

      static copyLineQuote() {
        if (clientState.days <= 0) {
          showToast("❌ 投保天數設定錯誤，無法複製報價單！");
          return;
        }

        const prodId = clientState.selectedProductId;
        const curProd = globalDB.products.find(p => p.ProductID === prodId);
        const prodName = curProd ? curProd.ProductName : '-';
        const totalText = document.getElementById("desktopTotalPremium").textContent;

        const startDt = `${clientState.startDate} ${clientState.startHour}:00`;
        const endDt = `${clientState.endDate} ${clientState.endHour}:00`;

        const quoteText = `【旅平險專業試算報價】
━━━━━━━━━━━━━━━
✈ 旅遊方案：${prodName}
📆 旅遊天數：${clientState.days} 天
🕒 保險生效：${startDt}
🕒 保險結束：${endDt}
━━━━━━━━━━━━━━━
👥 投保人數：
  ▪ 15歲以上：${clientState.adultCount} 人 (每人 ${document.getElementById("txtAdultUnitPrice").textContent})
  ▪ 未滿15歲：${clientState.childCount} 人 (每人 ${document.getElementById("txtChildUnitPrice").textContent})
━━━━━━━━━━━━━━━
身故保額：15歲以上 ${clientState.adultDeath} / 未滿15歲失能 ${clientState.childDeath}
傷害醫療：${clientState.medical}
💰 應收總保費：NT$ ${totalText} 元
━━━━━━━━━━━━━━━
業務員溫馨提醒：
出門在外多一分保障，多一分安心！本試算結果為即時保費參考，實際承保內容以投保條款為準。`;

        const dummy = document.createElement("textarea");
        document.body.appendChild(dummy);
        dummy.value = quoteText;
        dummy.select();
        document.execCommand("copy");
        document.body.removeChild(dummy);

        showToast("報價單已成功複製到剪貼簿！");
      }
    }

    function showToast(msg) {
      const toast = document.getElementById("toast");
      const toastMsg = document.getElementById("toastMsg");
      toastMsg.textContent = msg;
      
      toast.classList.remove("opacity-0", "scale-95", "pointer-events-none");
      toast.classList.add("opacity-100", "scale-100");

      setTimeout(() => {
        toast.classList.add("opacity-0", "scale-95", "pointer-events-none");
        toast.classList.remove("opacity-100", "scale-100");
      }, 3000);
    }
  </script>
