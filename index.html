<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>旅平險保費試算系統</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Flatpickr (極速一鍵選取日曆) CSS & JS & 繁體中文語系 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/zh-tw.js"></script>
  
  <style>
    :root {
      --primary-color: #1e40af;
      --border-radius: 12px;
      --font-family: 'Noto Sans TC', sans-serif;
      --card-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
      --footer-color: #0f172a;
    }
    body {
      font-family: var(--font-family);
      background-color: #f8fafc;
    }
    .custom-card {
      border-radius: var(--border-radius);
      box-shadow: var(--card-shadow);
    }
    .btn-primary {
      background-color: var(--primary-color);
      border-radius: var(--border-radius);
    }
    /* 隱藏原生 Chrome/Safari 等瀏覽器 input[type=number] 的小箭頭 */
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type=number] {
      -moz-appearance: textfield; /* Firefox */
    }
    /* Flatpickr 樣式自訂 - 完美契合主色 */
    .flatpickr-day.selected, .flatpickr-day.selected:hover {
      background: var(--primary-color) !important;
      border-color: var(--primary-color) !important;
    }
    .flatpickr-months .flatpickr-month {
      color: #0f172a !important;
    }
    .flatpickr-current-month .flatpickr-monthDropdown-months {
      font-weight: 700 !important;
    }
  </style>
</head>
<body class="text-gray-800 antialiased min-h-screen flex flex-col pb-44 lg:pb-6">

  <!-- 系統公告卡片 (依試算表動態控制) - 字體同步加大 -->
  <div id="announcementBanner" class="hidden bg-amber-50 border-b border-amber-200 py-3.5 px-4 text-center text-amber-900 text-sm md:text-base font-bold flex items-center justify-center gap-2">
    <i data-lucide="megaphone" class="w-5 h-5 text-amber-600 flex-shrink-0"></i>
    <span id="announcementText"></span>
  </div>

  <!-- 頂部導覽列 - 視覺與字體微調加大 -->
  <header class="bg-white border-b border-gray-100 py-4.5 px-6 sticky top-0 z-40 shadow-sm">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-2.5">
        <i data-lucide="shield-check" class="w-7 h-7 text-blue-700"></i>
        <h1 id="siteTitle" class="text-xl md:text-2xl font-bold text-gray-900">旅平險保費試算</h1>
      </div>
      <div class="text-right">
        <span id="effectiveDate" class="text-xs md:text-sm text-gray-400 bg-gray-50 px-3 py-1.5 rounded-full font-medium">適用載入中...</span>
      </div>
    </div>
  </header>

  <!-- 系統維護畫面 -->
  <div id="maintenanceScreen" class="hidden fixed inset-0 bg-white z-50 flex flex-col items-center justify-center p-6 text-center">
    <div class="w-16 h-16 bg-red-50 text-red-600 rounded-full flex items-center justify-center mb-4">
      <i data-lucide="alert-triangle" class="w-8 h-8"></i>
    </div>
    <h2 class="text-2xl font-bold text-gray-900 mb-2">目前系統維護中</h2>
    <p class="text-gray-500 max-w-md">我們正在更新費率與系統設定，請稍後再試。造成不便敬請見諒。</p>
  </div>

  <!-- 主內容區域：卡片外框全面對齊間距 (統一 space-y-4) -->
  <main class="flex-grow max-w-7xl w-full mx-auto p-4 md:p-6 lg:p-8 grid grid-cols-1 lg:grid-cols-12 gap-4 items-start">
    
    <!-- 左側：輸入表單 (佔 7 格，統一間距 space-y-4) -->
    <div class="lg:col-span-7 space-y-4">
      
      <!-- 1. 旅遊地區 (灰色底層 w-full 滿版，藍色立體按鈕加長 1.5 倍) -->
      <div class="bg-white p-5 rounded-xl border border-gray-100 custom-card">
        <label id="lblTravelArea" class="block text-base md:text-lg font-bold text-slate-900 mb-3">旅遊地區</label>
        <div class="flex bg-gray-100 p-1.5 rounded-xl w-full">
          <div class="flex-1 flex justify-center items-center">
            <button id="btnAreaOvs" class="w-[85%] py-3 text-base font-extrabold rounded-lg text-center bg-[var(--primary-color)] text-white shadow-md border-b-[3px] border-blue-950 -translate-y-[1px] transition-all focus:outline-none cursor-pointer" onclick="AppController.setArea('overseas')">
              海外旅遊
            </button>
          </div>
          <div class="flex-1 flex justify-center items-center">
            <button id="btnAreaDom" class="w-[85%] py-3 text-base font-extrabold rounded-lg text-center text-gray-500 hover:text-gray-900 border-b-[3px] border-transparent transition-all focus:outline-none cursor-pointer" onclick="AppController.setArea('domestic')">
              國內旅遊
            </button>
          </div>
        </div>
      </div>

      <!-- 2. 保險期間 (黃金正方形佈局：完美對齊與 custom chevron 下拉外觀) -->
      <div class="bg-white p-5 rounded-xl border border-gray-100 custom-card">
        <div class="grid grid-cols-2 gap-4">
          <!-- 左半邊：保險生效日 -->
          <div class="space-y-2">
            <label class="block text-base font-bold text-slate-900">保險生效日</label>
            <input type="text" id="startDate" class="w-full h-12 px-4 border border-gray-200 rounded-lg text-base font-bold text-gray-900 bg-white focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 outline-none transition cursor-pointer" placeholder="選擇日期" readonly>
            <div class="relative">
              <select id="startHour" class="w-full h-12 pl-4 pr-10 border border-gray-200 rounded-lg text-base font-bold text-gray-900 bg-white focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 outline-none transition appearance-none cursor-pointer" onchange="AppController.onPeriodChange()">
                <!-- 1 ~ 24 時 -->
              </select>
              <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3.5 text-gray-500">
                <i data-lucide="chevron-down" class="w-5 h-5"></i>
              </div>
            </div>
          </div>
          <!-- 右半邊：保險結束日 -->
          <div class="space-y-2">
            <label class="block text-base font-bold text-slate-900">保險結束日</label>
            <input type="text" id="endDate" class="w-full h-12 px-4 border border-gray-200 rounded-lg text-base font-bold text-gray-900 bg-white focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 outline-none transition cursor-pointer" placeholder="選擇日期" readonly>
            <div class="relative">
              <select id="endHour" class="w-full h-12 pl-4 pr-10 border border-gray-200 rounded-lg text-base font-bold text-gray-900 bg-white focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 outline-none transition appearance-none cursor-pointer" onchange="AppController.onPeriodChange()">
                <!-- 1 ~ 24 時 -->
              </select>
              <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3.5 text-gray-500">
                <i data-lucide="chevron-down" class="w-5 h-5"></i>
              </div>
            </div>
          </div>
          <!-- 下方橫條：旅遊天數 -->
          <div id="daysCardContainer" class="col-span-2 bg-blue-50/50 border border-blue-100 p-3.5 rounded-lg flex flex-col gap-1 transition-all duration-200">
            <div class="flex justify-between items-center">
              <span class="text-sm font-extrabold text-blue-800">旅遊天數</span>
              <div class="flex items-center gap-1">
                <span id="txtDays" class="text-lg font-extrabold text-blue-900">1</span>
                <span class="text-xs md:text-sm text-blue-800 font-bold">天</span>
              </div>
            </div>
            <!-- 動態警告訊息容器 -->
            <div id="daysWarningContainer" class="hidden text-xs md:text-sm font-bold text-red-600 flex items-center gap-1.5 mt-1"></div>
          </div>
        </div>
      </div>

      <!-- 3. 海外突發疾病 (海外專用，灰色底層 w-full 滿版，藍色立體按鈕加長 1.5 倍) -->
      <div id="diseaseSection" class="bg-white p-5 rounded-xl border border-gray-100 custom-card transition-all">
        <label class="block text-base md:text-lg font-bold text-slate-900 mb-3">海外突發疾病</label>
        <div class="flex bg-gray-100 p-1.5 rounded-xl w-full">
          <div class="flex-1 flex justify-center items-center">
            <button id="btnDiseaseWith" class="w-[85%] py-2.5 text-sm font-extrabold rounded-md transition-all text-center bg-[var(--primary-color)] text-white shadow-md border-b-[3px] border-blue-950 -translate-y-[1px] transition-all focus:outline-none cursor-pointer" onclick="AppController.setDisease(true)">
              含法定傳染病
            </button>
          </div>
          <div class="flex-1 flex justify-center items-center">
            <button id="btnDiseaseWithout" class="w-[85%] py-2.5 text-sm font-extrabold rounded-md transition-all text-center text-gray-500 hover:text-gray-900 border-b-[3px] border-transparent transition-all focus:outline-none cursor-pointer" onclick="AppController.setDisease(false)">
              不含法定傳染病
            </button>
          </div>
        </div>
      </div>

      <!-- 4. 投保方案 -->
      <div class="bg-white p-5 rounded-xl border border-gray-100 custom-card">
        <label class="block text-base md:text-lg font-bold text-slate-900 mb-3">投保方案</label>
        <div class="relative">
          <select id="selProduct" class="w-full px-4 py-3.5 border border-gray-200 rounded-lg text-base bg-white font-extrabold text-gray-950 focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 outline-none transition appearance-none cursor-pointer" onchange="AppController.onProductSelectChange()">
            <!-- 動態載入商品下拉選項 -->
          </select>
          <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3.5 text-gray-500">
            <i data-lucide="chevron-down" class="w-5 h-5"></i>
          </div>
        </div>
      </div>

      <!-- 5. 整合投保人數與保障額度 -->
      <div class="bg-white p-5 rounded-xl border border-gray-100 custom-card space-y-5">
        
        <!-- A. 投保人數區 -->
        <div class="grid grid-cols-2 gap-4 border-b border-gray-100 pb-5">
          <!-- 左欄：15歲以上人數 (大人) -->
          <div class="flex flex-col items-center p-3 bg-slate-50/50 rounded-xl border border-slate-100">
            <span class="text-sm font-extrabold text-slate-500 mb-1" id="lblAdult">15歲以上人數</span>
            <div class="flex items-center gap-2.5 my-2">
              <button class="w-10 h-10 bg-white text-gray-600 border border-gray-200 rounded-full text-lg font-bold flex items-center justify-center hover:bg-gray-100 transition focus:outline-none shadow-sm active:scale-95" onclick="AppController.adjustCount('adult', -1)">-</button>
              <input type="number" id="txtAdultCount" class="w-14 h-10 text-center font-black text-lg text-gray-900 border border-gray-200 rounded bg-white focus:ring-1 focus:ring-blue-500 focus:outline-none" value="1" min="0" oninput="AppController.onCountInputChange('adult')" onblur="AppController.onCountInputBlur('adult')">
              <button class="w-10 h-10 bg-white text-gray-600 border border-gray-200 rounded-full text-lg font-bold flex items-center justify-center hover:bg-gray-100 transition focus:outline-none shadow-sm active:scale-95" onclick="AppController.adjustCount('adult', 1)">+</button>
            </div>
            <div class="text-xs font-bold text-gray-400 mt-0.5">每人保費: <span id="txtAdultUnitPrice" class="font-bold text-blue-700">$-</span></div>
          </div>

          <!-- 右欄：未滿15歲人數 (小孩) -->
          <div class="flex flex-col items-center p-3 bg-slate-50/50 rounded-xl border border-slate-100">
            <span class="text-sm font-extrabold text-slate-500 mb-1" id="lblChild">未滿15歲人數</span>
            <div class="flex items-center gap-2.5 my-2">
              <button class="w-10 h-10 bg-white text-gray-600 border border-gray-200 rounded-full text-lg font-bold flex items-center justify-center hover:bg-gray-100 transition focus:outline-none shadow-sm active:scale-95" onclick="AppController.adjustCount('child', -1)">-</button>
              <input type="number" id="txtChildCount" class="w-14 h-10 text-center font-black text-lg text-gray-900 border border-gray-200 rounded bg-white focus:ring-1 focus:ring-blue-500 focus:outline-none" value="0" min="0" oninput="AppController.onCountInputChange('child')" onblur="AppController.onCountInputBlur('child')">
              <button class="w-10 h-10 bg-white text-gray-600 border border-gray-200 rounded-full text-lg font-bold flex items-center justify-center hover:bg-gray-100 transition focus:outline-none shadow-sm active:scale-95" onclick="AppController.adjustCount('child', 1)">+</button>
            </div>
            <div class="text-xs font-bold text-gray-400 mt-0.5">每人保費: <span id="txtChildUnitPrice" class="font-bold text-blue-700">$-</span></div>
          </div>
        </div>

        <!-- B. 保障額度設定區 -->
        <div class="space-y-4">
          <div class="text-sm font-semibold text-slate-900 flex items-center gap-1.5">
            <i data-lucide="shield-alert" class="w-4 h-4 text-blue-700"></i>
            <span>保障額度</span>
          </div>
          
          <div class="grid grid-cols-2 gap-4">
            <!-- 左欄：15歲以上身故保額 -->
            <div>
              <label class="block text-xs font-extrabold text-gray-500 mb-1.5">15歲以上身故保額</label>
              <div class="relative">
                <select id="selAdultDeath" class="w-full pl-4 pr-10 py-2.5 border border-gray-200 rounded-lg text-base bg-white font-bold focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 outline-none transition appearance-none cursor-pointer" onchange="AppController.onLimitChange()">
                  <!-- 動態 -->
                </select>
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-gray-500">
                  <i data-lucide="chevron-down" class="w-4 h-4"></i>
                </div>
              </div>
            </div>
            <!-- 右欄：未滿15歲失能保額 -->
            <div>
              <label class="block text-xs font-extrabold text-gray-500 mb-1.5">未滿15歲失能保額</label>
              <div class="relative">
                <select id="selChildDeath" class="w-full pl-4 pr-10 py-2.5 border border-gray-200 rounded-lg text-base bg-white font-bold focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 outline-none transition appearance-none cursor-pointer" onchange="AppController.onLimitChange()">
                  <!-- 動態 -->
                </select>
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-gray-500">
                  <i data-lucide="chevron-down" class="w-4 h-4"></i>
                </div>
              </div>
            </div>
          </div>

          <!-- 傷害醫療保額 -->
          <div>
            <label class="block text-xs font-extrabold text-gray-500 mb-1.5">傷害醫療保額</label>
            <div class="relative">
              <select id="selMedical" class="w-full pl-4 pr-10 py-2.5 border border-gray-200 rounded-lg text-base bg-white font-bold focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 outline-none transition appearance-none cursor-pointer" onchange="AppController.onLimitChange()">
                <!-- 動態 -->
              </select>
              <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-gray-500">
                <i data-lucide="chevron-down" class="w-4 h-4"></i>
              </div>
            </div>
          </div>
        </div>

      </div>

    </div>

    <!-- 右側：摘要卡片、保障內容、注意事項 (佔 5 格，統一間距 space-y-4) -->
    <div class="lg:col-span-5 space-y-4">
      
      <!-- 桌機版固定右側總保費卡 -->
      <div class="hidden lg:block bg-white p-6 rounded-xl border border-gray-100 custom-card sticky top-24 z-30">
        <h3 class="text-sm font-extrabold text-gray-400 tracking-wider uppercase mb-2">試算結果摘要</h3>
        <div class="flex justify-between items-baseline mb-4">
          <span class="text-base font-bold text-gray-500">應收總保費</span>
          <div>
            <span class="text-sm font-bold text-blue-700">NT$</span>
            <span id="desktopTotalPremium" class="text-4xl md:text-5xl font-black text-blue-900">0</span>
          </div>
        </div>
        <div class="space-y-3 text-sm text-gray-500 border-t border-gray-100 pt-4 mb-5">
          <div class="flex justify-between">
            <span>旅遊天數:</span>
            <span class="font-extrabold text-gray-900"><span id="summaryDays">1</span> 天</span>
          </div>
          <div class="flex justify-between">
            <span>所選方案:</span>
            <span class="font-extrabold text-gray-900" id="summaryProduct">-</span>
          </div>
          <div class="flex justify-between">
            <span>投保人數:</span>
            <span class="font-extrabold text-gray-900"><span id="summaryAdults">1</span>大 / <span id="summaryChildren">0</span>小</span>
          </div>
        </div>
        <button onclick="AppController.copyLineQuote()" class="w-full py-4 px-6 btn-primary text-white font-black text-base shadow-md hover:brightness-105 active:scale-[0.98] transition flex items-center justify-center gap-2 cursor-pointer">
          <i data-lucide="copy" class="w-5 h-5"></i>
          複製 LINE 格式報價
        </button>
      </div>

      <!-- 6. 方案承保內容 -->
      <div id="coverageSection" class="bg-white p-5 rounded-xl border border-gray-100 custom-card">
        <div class="flex items-center gap-2 border-b border-gray-100 pb-3 mb-4">
          <i data-lucide="shield" class="w-5 h-5 text-blue-700"></i>
          <h3 id="lblCoverage" class="text-base font-black text-slate-900">方案承保內容</h3>
        </div>
        <div id="coverageList" class="space-y-3">
          <!-- 動態渲染保障項目 -->
        </div>
      </div>

      <!-- 7. 投保注意事項 -->
      <div id="noticeSection" class="bg-white p-5 rounded-xl border border-gray-100 custom-card">
        <div class="flex items-center gap-2 border-b border-gray-100 pb-3 mb-4">
          <i data-lucide="info" class="w-5 h-5 text-amber-500"></i>
          <h3 id="lblNotice" class="text-base font-black text-slate-900">注意事項</h3>
        </div>
        <ul id="noticeList" class="space-y-2 list-disc list-inside text-sm text-gray-500 leading-relaxed font-medium">
          <!-- 動態渲染注意事項 -->
        </ul>
      </div>

    </div>
  </main>

  <!-- 手機版 Sticky Footer (已大幅放大框框內文字 50%，同時維持按鈕原本的比例) -->
  <div class="lg:hidden fixed bottom-0 left-0 right-0 bg-slate-900 text-white py-8 px-6 flex items-center justify-between border-t border-slate-800 z-40 shadow-xl">
    <div>
      <!-- 應收總保費標籤：從 text-xs 放大至 text-lg -->
      <span class="block text-lg text-slate-300 font-extrabold tracking-wider" id="mobileTotalPremiumLabel">應收總保費</span>
      <div class="flex items-baseline gap-1 mt-0.5">
        <!-- 錢幣符號：從 text-xs 放大至 text-lg -->
        <span class="text-lg text-slate-400 font-extrabold">NT$</span>
        <!-- 總保費金額：從 text-3.5xl 放大至 text-5xl -->
        <span id="mobileTotalPremium" class="text-5xl font-black text-blue-400">0</span>
      </div>
    </div>
    <div class="flex items-center gap-4">
      <!-- 旅遊天數、人數：從 text-xs 放大至 text-base -->
      <div class="text-right text-base text-slate-300 font-extrabold mr-1 leading-snug">
        <div><span id="mobileSummaryDays">1</span> 天</div>
        <div><span id="mobileSummaryAdults">1</span>大 / <span id="mobileSummaryChildren">0</span>小</div>
      </div>
      <!-- 複製報價按鈕：高度、寬度、文字與 Icon 完美維持原有高水準比例不變 -->
      <button onclick="AppController.copyLineQuote()" class="bg-[var(--primary-color)] text-white font-black text-sm py-3.5 px-5 rounded-lg shadow active:scale-95 transition flex items-center gap-1.5 cursor-pointer">
        <i data-lucide="copy" class="w-4 h-4"></i>
        複製報價
      </button>
    </div>
  </div>

  <!-- 成功提示 Toast 訊息 -->
  <div id="toast" class="fixed top-24 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white px-4 py-2.5 rounded-full text-xs font-semibold shadow-xl opacity-0 scale-95 pointer-events-none transition-all duration-300 z-50 flex items-center gap-1.5">
    <i data-lucide="check-circle" class="w-4 h-4 text-emerald-400"></i>
    <span id="toastMsg">複製成功！</span>
  </div>

  <!-- JS 邏輯區 -->
  <script>
    // 串接使用者部署好的 Google Apps Script 雲端 API 網址
    const GOOGLE_APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzCudyI5uo1lDZXVsUfTxZrfzeLrLLzUh70N38HWLcAsn75-22G44cZ5ijzmyH86MJx/exec";
    const CACHE_KEY = "TRAVEL_INS_CACHE_V3";
    const CACHE_TIME_KEY = "TRAVEL_INS_CACHE_TIME_V3";
    const CACHE_DURATION_MS = 5 * 60 * 1000; // 5 分鐘快取

    // 全域資料儲存庫
    let globalDB = {
      control: {},
      products: [],
      productOptions: [],
      rates: [],
      coverages: [],
      notes: [],
      ui: {},
      texts: {}
    };

    // 前台操作狀態 management
    let clientState = {
      area: 'overseas',          // 'domestic' | 'overseas'
      diseaseOption: true,      // true (含法傳) | false (不含)
      selectedProductId: '',     // 當前方案編號
      startDate: '',
      startHour: 10,
      endDate: '',
      endHour: 10,
      days: 1,
      adultDeath: '',
      childDeath: '',
      medical: '',
      adultCount: 1,
      childCount: 0
    };

    // Flatpickr 控制物件
    let startPickerInstance = null;
    let endPickerInstance = null;

    // 系統初始化入口
    window.onload = async function() {
      // 1. 生成 1~24 小時的下拉選單
      initHourSelectors();
      
      // 2. 初始化 Flatpickr 與預設日期
      initCalendarAndDates();

      // 3. 讀取並套用雲端資料庫
      await loadDatabase();

      // 4. 初始化 Lucide 圖標
      lucide.createIcons();
    };

    // 生成小時選項
    function initHourSelectors() {
      const startSel = document.getElementById("startHour");
      const endSel = document.getElementById("endHour");
      for (let i = 1; i <= 24; i++) {
        const optStart = document.createElement("option");
        optStart.value = i;
        optStart.textContent = `${i} 時`;
        startSel.appendChild(optStart);

        const optEnd = document.createElement("option");
        optEnd.value = i;
        optEnd.textContent = `${i} 時`;
        endSel.appendChild(optEnd);
      }
      startSel.value = 10;
      endSel.value = 10;
    }

    // 初始化 Flatpickr 與預設日期設定
    function initCalendarAndDates() {
      const today = new Date();
      const tomorrow = new Date();
      tomorrow.setDate(today.getDate() + 1);

      const toDateString = (d) => {
        const year = d.getFullYear();
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${year}/${month}/${day}`;
      };

      const todayStr = toDateString(today);
      const tomorrowStr = toDateString(tomorrow);

      clientState.startDate = todayStr;
      clientState.endDate = tomorrowStr;

      // 生效日日曆初始化
      startPickerInstance = flatpickr("#startDate", {
        locale: "zh_tw",
        dateFormat: "Y/m/d",
        defaultDate: todayStr,
        disableMobile: "true",
        onChange: function(selectedDates, dateStr) {
          clientState.startDate = dateStr;
          AppController.onPeriodChange();
        }
      });

      // 結束日日曆初始化
      endPickerInstance = flatpickr("#endDate", {
        locale: "zh_tw",
        dateFormat: "Y/m/d",
        defaultDate: tomorrowStr,
        disableMobile: "true",
        onChange: function(selectedDates, dateStr) {
          clientState.endDate = dateStr;
          AppController.onPeriodChange();
        }
      });
    }

    // 載入資料庫：優先使用快取，過期則重新呼叫 API
    async function loadDatabase() {
      const cacheData = localStorage.getItem(CACHE_KEY);
      const cacheTime = localStorage.getItem(CACHE_TIME_KEY);
      const now = Date.now();

      if (cacheData && cacheTime && (now - parseInt(cacheTime) < CACHE_DURATION_MS)) {
        try {
          globalDB = JSON.parse(cacheData);
          applyDBData();
          return;
        } catch(e) {
          console.error("解析快取失敗，改用 API 獲取", e);
        }
      }

      // 無快取或快取過期，向 Google Apps Script 發送 Request
      try {
        const response = await fetch(GOOGLE_APPS_SCRIPT_URL);
        if (!response.ok) throw new Error("API 回應失敗");
        const data = await response.json();
        
        if (data.error) throw new Error(data.error);

        // 寫入快取與記憶體
        globalDB = data;
        localStorage.setItem(CACHE_KEY, JSON.stringify(data));
        localStorage.setItem(CACHE_TIME_KEY, now.toString());

        applyDBData();
      } catch (err) {
        console.error("雲端 API 連線失敗", err);
        // 若快取可用則作為降級方案
        if (cacheData) {
          globalDB = JSON.parse(cacheData);
          applyDBData();
          showToast("⚠️ API 讀取失敗，改採離線快取資料");
        } else {
          // 無法讀取且無快取，顯示維護畫面
          document.getElementById("maintenanceScreen").classList.remove("hidden");
        }
      }
    }

    // 渲染資料庫設定到前台介面上
    function applyDBData() {
      // 1. 控制台與文案套用
      if (globalDB.control.SiteTitle) {
        document.getElementById("siteTitle").textContent = globalDB.control.SiteTitle;
      }
      if (globalDB.control.EffectiveDate) {
        document.getElementById("effectiveDate").textContent = globalDB.control.EffectiveDate;
      }
      
      // 公告顯示與隱藏
      if (globalDB.control.Announcement && globalDB.control.Announcement.trim() !== "") {
        document.getElementById("announcementBanner").classList.remove("hidden");
        document.getElementById("announcementText").textContent = globalDB.control.Announcement;
      } else {
        document.getElementById("announcementBanner").classList.add("hidden");
      }

      // UI 視覺動態設定
      if (globalDB.ui) {
        const root = document.documentElement;
        if (globalDB.ui.PrimaryColor) root.style.setProperty('--primary-color', globalDB.ui.PrimaryColor);
        if (globalDB.ui.BorderRadius) root.style.setProperty('--border-radius', globalDB.ui.BorderRadius);
        if (globalDB.ui.FontFamily) root.style.setProperty('--font-family', globalDB.ui.FontFamily);
        if (globalDB.ui.CardShadow) root.style.setProperty('--card-shadow', globalDB.ui.CardShadow);
        if (globalDB.ui.FooterColor) root.style.setProperty('--footer-color', globalDB.ui.FooterColor);
      }

      // 自訂文字欄位文案
      if (globalDB.texts) {
        if (globalDB.texts.TravelArea) document.getElementById("lblTravelArea").textContent = globalDB.texts.TravelArea;
        if (globalDB.texts.Adult) document.getElementById("lblAdult").textContent = globalDB.texts.Adult;
        if (globalDB.texts.Child) document.getElementById("lblChild").textContent = globalDB.texts.Child;
        if (globalDB.texts.TotalPremium) {
          document.getElementById("mobileTotalPremiumLabel").textContent = globalDB.texts.TotalPremium;
        }
        if (globalDB.texts.Coverage) document.getElementById("lblCoverage").textContent = globalDB.texts.Coverage;
        if (globalDB.texts.Notice) document.getElementById("lblNotice").textContent = globalDB.texts.Notice;
      }

      // 2. 觸發天數計算
      AppController.calculateDays();

      // 3. 設定預設選擇區域並同步畫面
      AppController.syncAreaUI();
    }

    // 業務控制器（商業邏輯核心）
    class AppController {
      
      // 切換國內外
      static setArea(area) {
        clientState.area = area;
        this.syncAreaUI();
        this.calculateDays();
      }

      // 同步區域按鈕與對應輸入區狀態
      static syncAreaUI() {
        const btnOvs = document.getElementById("btnAreaOvs");
        const btnDom = document.getElementById("btnAreaDom");
        const diseaseSec = document.getElementById("diseaseSection");

        if (clientState.area === 'overseas') {
          btnOvs.className = "w-[85%] py-3 text-base font-extrabold rounded-lg text-center bg-[var(--primary-color)] text-white shadow-md border-b-[3px] border-blue-950 -translate-y-[1px] transition-all focus:outline-none cursor-pointer";
          btnDom.className = "w-[85%] py-3 text-base font-extrabold rounded-lg text-center text-gray-500 hover:text-gray-900 border-b-[3px] border-transparent transition-all focus:outline-none cursor-pointer";
          diseaseSec.classList.remove("hidden");
        } else {
          btnOvs.className = "w-[85%] py-3 text-base font-extrabold rounded-lg text-center text-gray-500 hover:text-gray-900 border-b-[3px] border-transparent transition-all focus:outline-none cursor-pointer";
          btnDom.className = "w-[85%] py-3 text-base font-extrabold rounded-lg text-center bg-[var(--primary-color)] text-white shadow-md border-b-[3px] border-blue-950 -translate-y-[1px] transition-all focus:outline-none cursor-pointer";
          diseaseSec.classList.add("hidden");
        }

        this.syncDiseaseUI();
        this.updateProducts();
      }

      // 切換是否含有法定傳染病
      static setDisease(hasOption) {
        clientState.diseaseOption = hasOption;
        this.syncDiseaseUI();
        this.updateProducts();
      }

      // 同步法傳按鈕狀態 (左右按鈕加長 1.5 倍)
      static syncDiseaseUI() {
        const btnWith = document.getElementById("btnDiseaseWith");
        const btnWithout = document.getElementById("btnDiseaseWithout");

        if (clientState.diseaseOption) {
          btnWith.className = "w-[85%] py-2.5 text-sm font-extrabold rounded-md text-center bg-[var(--primary-color)] text-white shadow-md border-b-[3px] border-blue-950 -translate-y-[1px] transition-all focus:outline-none cursor-pointer";
          btnWithout.className = "w-[85%] py-2.5 text-sm font-extrabold rounded-md text-center text-gray-500 hover:text-gray-900 border-b-[3px] border-transparent transition-all focus:outline-none cursor-pointer";
        } else {
          btnWith.className = "w-[85%] py-2.5 text-sm font-extrabold rounded-md text-center text-gray-500 hover:text-gray-900 border-b-[3px] border-transparent transition-all focus:outline-none cursor-pointer";
          btnWithout.className = "w-[85%] py-2.5 text-sm font-extrabold rounded-md text-center bg-[var(--primary-color)] text-white shadow-md border-b-[3px] border-blue-950 -translate-y-[1px] transition-all focus:outline-none cursor-pointer";
        }
      }

      // 依地區與法傳篩選商品 (超高容錯率防呆篩選器)
      static updateProducts() {
        const selectEl = document.getElementById("selProduct");
        if (!selectEl) return;
        selectEl.innerHTML = "";

        // 篩選商品
        const filtered = globalDB.products.filter(p => {
          if (!p.Enable) return false;
          if (p.Area !== clientState.area) return false;
          if (clientState.area === 'overseas') {
            // 超強相容度字串比對，預防資料庫有前後空白、未定義
            const pOpt = (p.DiseaseOption || "").toString().trim();
            if (clientState.diseaseOption) {
              // 點選「含法傳」：匹配 "含法定傳染病" 且排除 "不含"
              return pOpt.includes("含") && !pOpt.includes("不含");
            } else {
              // 點選「不含法傳」：匹配 "不含"、空白、或是完全沒設定的預設方案
              return pOpt.includes("不含") || pOpt === "" || pOpt === "無" || !p.DiseaseOption;
            }
          }
          return true;
        });

        // 依排序權重 Sorting
        filtered.sort((a, b) => (a.Sort || 0) - (b.Sort || 0));

        if (filtered.length === 0) {
          const opt = document.createElement("option");
          opt.value = "";
          opt.textContent = "無符合之方案計畫";
          selectEl.appendChild(opt);
          clientState.selectedProductId = "";
          this.updateProductOptions();
          return;
        }

        // 渲染商品下拉選項
        filtered.forEach((prod) => {
          const opt = document.createElement("option");
          opt.value = prod.ProductID;
          const diseaseTag = prod.DiseaseOption ? ` (${prod.DiseaseOption})` : "";
          opt.textContent = `${prod.ProductName}${diseaseTag}`;
          selectEl.appendChild(opt);
        });

        // 預設選取當前已選的 ID，若不在清單中則選第一個
        const hasMatch = filtered.some(p => p.ProductID === clientState.selectedProductId);
        if (!hasMatch && filtered.length > 0) {
          clientState.selectedProductId = filtered[0].ProductID;
        }
        selectEl.value = clientState.selectedProductId;

        this.updateProductOptions();
      }

      // 下拉選單方案改變時觸發
      static onProductSelectChange() {
        const selectEl = document.getElementById("selProduct");
        clientState.selectedProductId = selectEl.value;
        this.updateProductOptions();
      }

      // 更新保額與醫療等選項
      static updateProductOptions() {
        const prodId = clientState.selectedProductId;
        const selAdult = document.getElementById("selAdultDeath");
        const selChild = document.getElementById("selChildDeath");
        const selMedical = document.getElementById("selMedical");

        selAdult.innerHTML = "";
        selChild.innerHTML = "";
        selMedical.innerHTML = "";

        if (!prodId) {
          selAdult.innerHTML = `<option value="">無</option>`;
          selChild.innerHTML = `<option value="">無</option>`;
          selMedical.innerHTML = `<option value="">無</option>`;
          this.calculatePremium();
          return;
        }

        // 從 商品選項 表過濾該 ProductID
        const options = globalDB.productOptions.filter(o => o.ProductID === prodId && o.Enable);
        options.sort((a, b) => (a.Sort || 0) - (b.Sort || 0));

        if (options.length === 0) {
          selAdult.innerHTML = `<option value="">無</option>`;
          selChild.innerHTML = `<option value="">無</option>`;
          selMedical.innerHTML = `<option value="">無</option>`;
          return;
        }

        // 取不重複的選項填入下拉選單
        const adults = [...new Set(options.map(o => o.AdultDeath))].filter(Boolean);
        const children = [...new Set(options.map(o => o.ChildDeath))].filter(Boolean);
        const medicals = [...new Set(options.map(o => o.Medical))].filter(Boolean);

        adults.forEach(val => {
          const opt = document.createElement("option");
          opt.value = val;
          opt.textContent = val;
          selAdult.appendChild(opt);
        });

        children.forEach(val => {
          const opt = document.createElement("option");
          opt.value = val;
          opt.textContent = val;
          selChild.appendChild(opt);
        });

        medicals.forEach(val => {
          const opt = document.createElement("option");
          opt.value = val;
          opt.textContent = val;
          selMedical.appendChild(opt);
        });

        // 預設選擇第一個
        clientState.adultDeath = adults[0] || '';
        clientState.childDeath = children[0] || '';
        clientState.medical = medicals[0] || '';

        this.syncDynamicSections();
        this.calculatePremium();
      }

      // 當起迄日或時間改變
      static onPeriodChange() {
        clientState.startHour = parseInt(document.getElementById("startHour").value);
        clientState.endHour = parseInt(document.getElementById("endHour").value);

        this.calculateDays();
        this.calculatePremium();
      }

      // 核心天數運算：採 Unix Epoch 時間戳差並使用 Math.ceil 無條件進位
      static calculateDays() {
        const startVal = clientState.startDate;
        const endVal = clientState.endDate;
        const startH = clientState.startHour;
        const endH = clientState.endHour;

        const daysCard = document.getElementById("daysCardContainer");
        const warningContainer = document.getElementById("daysWarningContainer");

        if (!startVal || !endVal) {
          clientState.days = 1;
          this.updateDaysUI();
          return;
        }

        // 將斜線格式的字串 YYYY/MM/DD 在生成 Date 前暫時格式化為橫線以保持 ISO 相容性
        const formatISO = (s) => s.replace(/\//g, '-');
        const startDateTime = new Date(`${formatISO(startVal)}T${String(startH).padStart(2, '0')}:00:00`);
        const endDateTime = new Date(`${formatISO(endVal)}T${String(endH).padStart(2, '0')}:00:00`);

        let errorMsg = "";

        if (startDateTime > endDateTime) {
          errorMsg = "保險生效日不可晚於結束日！";
        } else {
          // 計算總時差並採無條件進位
          const diffMs = endDateTime.getTime() - startDateTime.getTime();
          const diffHours = diffMs / (1000 * 60 * 60);
          let calculatedDays = Math.ceil(diffHours / 24);

          if (calculatedDays <= 0) calculatedDays = 1;

          // 國內 / 海外天數限額驗證
          if (clientState.area === 'domestic' && calculatedDays > 14) {
            errorMsg = `國內旅遊投保天數最多 14 天！(目前 ${calculatedDays} 天)`;
          } else if (clientState.area === 'overseas' && calculatedDays > 180) {
            errorMsg = `海外旅遊投保天數最多 180 天！(目前 ${calculatedDays} 天)`;
          }

          clientState.days = calculatedDays;
        }

        // 警示 UI 切換渲染
        if (errorMsg) {
          daysCard.className = "col-span-2 bg-red-50 border-2 border-red-500 p-3.5 rounded-lg flex flex-col gap-1 transition-all duration-200 shadow-sm";
          warningContainer.className = "text-xs md:text-sm font-black text-red-600 flex items-center gap-1 mt-1";
          warningContainer.innerHTML = `<i data-lucide="alert-triangle" class="w-4 h-4 text-red-600 flex-shrink-0"></i><span>${errorMsg}</span>`;
          warningContainer.classList.remove("hidden");
          lucide.createIcons();

          clientState.days = 0; 
          this.updateDaysUI(true);
        } else {
          daysCard.className = "col-span-2 bg-blue-50/50 border border-blue-100 p-3.5 rounded-lg flex flex-col gap-1 transition-all duration-200";
          warningContainer.classList.add("hidden");
          warningContainer.innerHTML = "";

          this.updateDaysUI(false);
        }
      }

      static updateDaysUI(isError = false) {
        const daysVal = isError ? "--" : clientState.days;
        document.getElementById("txtDays").textContent = daysVal;
        document.getElementById("summaryDays").textContent = daysVal;
        document.getElementById("mobileSummaryDays").textContent = daysVal;
      }

      // 當額度選項變更時
      static onLimitChange() {
        clientState.adultDeath = document.getElementById("selAdultDeath").value;
        clientState.childDeath = document.getElementById("selChildDeath").value;
        clientState.medical = document.getElementById("selMedical").value;

        this.calculatePremium();
      }

      // 計算總保費
      static calculatePremium() {
        const prodId = clientState.selectedProductId;
        const days = clientState.days;
        const adDeath = clientState.adultDeath;
        const chDeath = clientState.childDeath;
        const med = clientState.medical;

        let adultPrice = 0;
        let childPrice = 0;

        if (days > 0 && prodId) {
          // 搜尋合適費率
          const rateRecord = globalDB.rates.find(r => 
            r.ProductID === prodId &&
            parseInt(r.Days) === parseInt(days) &&
            r.AdultDeath === adDeath &&
            r.ChildDeath === chDeath &&
            r.Medical === med
          );

          if (rateRecord) {
            adultPrice = parseInt(rateRecord.AdultPremium) || 0;
            childPrice = parseInt(rateRecord.ChildPremium) || 0;
            
            document.getElementById("txtAdultUnitPrice").textContent = `NT$ ${adultPrice.toLocaleString()}`;
            document.getElementById("txtChildUnitPrice").textContent = `NT$ ${childPrice.toLocaleString()}`;
          } else {
            document.getElementById("txtAdultUnitPrice").textContent = "查無費率";
            document.getElementById("txtChildUnitPrice").textContent = "查無費率";
          }
        } else {
          document.getElementById("txtAdultUnitPrice").textContent = "$-";
          document.getElementById("txtChildUnitPrice").textContent = "$-";
        }

        // 計算總保費
        const total = (adultPrice * clientState.adultCount) + (childPrice * clientState.childCount);

        // 更新 UI 數據
        const displayTotal = days > 0 ? total.toLocaleString() : "--";
        document.getElementById("desktopTotalPremium").textContent = displayTotal;
        document.getElementById("mobileTotalPremium").textContent = displayTotal;

        const curProd = globalDB.products.find(p => p.ProductID === prodId);
        const prodName = curProd ? curProd.ProductName : '-';
        
        const summaryProdEl = document.getElementById("summaryProduct");
        if (summaryProdEl) {
          summaryProdEl.textContent = prodName;
        }

        this.updateSummaryPeople();
      }

      // 人數調整器 (Stepper)
      static adjustCount(type, delta) {
        const inputEl = document.getElementById(type === 'adult' ? "txtAdultCount" : "txtChildCount");
        let currentVal = parseInt(inputEl.value) || 0;
        let newVal = currentVal + delta;
        if (newVal < 0) newVal = 0;
        
        inputEl.value = newVal;

        if (type === 'adult') {
          clientState.adultCount = newVal;
        } else {
          clientState.childCount = newVal;
        }
        this.calculatePremium();
      }

      // 人數手動輸入框鍵入更新
      static onCountInputChange(type) {
        const inputEl = document.getElementById(type === 'adult' ? "txtAdultCount" : "txtChildCount");
        let val = inputEl.value;

        let numVal = parseInt(val);
        if (isNaN(numVal) || numVal < 0) {
          numVal = 0;
        }

        if (type === 'adult') {
          clientState.adultCount = numVal;
        } else {
          clientState.childCount = numVal;
        }
        this.calculatePremium();
      }

      // 人數手動輸入框點開/離開防呆還原
      static onCountInputBlur(type) {
        const inputEl = document.getElementById(type === 'adult' ? "txtAdultCount" : "txtChildCount");
        let val = parseInt(inputEl.value);
        
        if (isNaN(val) || val < 0) {
          val = 0;
        }
        inputEl.value = val;

        if (type === 'adult') {
          clientState.adultCount = val;
        } else {
          clientState.childCount = val;
        }
        this.calculatePremium();
      }

      // 同步右側摘要卡人數
      static updateSummaryPeople() {
        document.getElementById("summaryAdults").textContent = clientState.adultCount;
        document.getElementById("summaryChildren").textContent = clientState.childCount;
        document.getElementById("mobileSummaryAdults").textContent = clientState.adultCount;
        document.getElementById("mobileSummaryChildren").textContent = clientState.childCount;
      }

      // 渲染動態保障細項與注意事項
      static syncDynamicSections() {
        const prodId = clientState.selectedProductId;

        // 1. 承保內容項目
        const covList = document.getElementById("coverageList");
        covList.innerHTML = "";

        if (!prodId) {
          document.getElementById("coverageSection").classList.add("hidden");
        } else {
          const items = globalDB.coverages.filter(c => c.ProductID === prodId);
          items.sort((a, b) => (a.Sort || 0) - (b.Sort || 0));

          if (items.length === 0) {
            document.getElementById("coverageSection").classList.add("hidden");
          } else {
            document.getElementById("coverageSection").classList.remove("hidden");
            items.forEach(c => {
              const itemDiv = document.createElement("div");
              itemDiv.className = "flex justify-between items-start py-2.5 border-b border-gray-50 text-sm";
              itemDiv.innerHTML = `
                <span class="font-semibold text-gray-700 max-w-[50%]">${c.Item}</span>
                <div class="text-right">
                  <span class="block text-blue-900 font-extrabold text-sm">15歲以上: ${c.AdultValue || '無'}</span>
                  <span class="block text-gray-500 font-bold text-xs mt-0.5">未滿15歲: ${c.ChildValue || '無'}</span>
                </div>
              `;
              covList.appendChild(itemDiv);
            });
          }
        }

        // 2. 注意事項項目
        const noteList = document.getElementById("noticeList");
        noteList.innerHTML = "";

        if (!prodId) {
          document.getElementById("noticeSection").classList.add("hidden");
        } else {
          const notes = globalDB.notes.filter(n => n.ProductID === prodId);
          notes.sort((a, b) => (a.Sort || 0) - (b.Sort || 0));

          if (notes.length === 0) {
            document.getElementById("noticeSection").classList.add("hidden");
          } else {
            document.getElementById("noticeSection").classList.remove("hidden");
            notes.forEach(n => {
              const li = document.createElement("li");
              li.textContent = n.Content;
              noteList.appendChild(li);
            });
          }
        }
      }

      // 一鍵複製 LINE 報價單
      static copyLineQuote() {
        if (clientState.days <= 0) {
          showToast("❌ 投保天數設定錯誤，無法複製報價單！");
          return;
        }

        const prodId = clientState.selectedProductId;
        const curProd = globalDB.products.find(p => p.ProductID === prodId);
        const prodName = curProd ? curProd.ProductName : '-';
        const totalText = document.getElementById("desktopTotalPremium").textContent;

        const startDt = `${clientState.startDate} ${clientState.startHour}:00`;
        const endDt = `${clientState.endDate} ${clientState.endHour}:00`;

        const quoteText = `【旅平險專業試算報價】
━━━━━━━━━━━━━━━
✈ 旅遊方案：${prodName}
📆 旅遊天數：${clientState.days} 天
🕒 保險生效：${startDt}
🕒 保險結束：${endDt}
━━━━━━━━━━━━━━━
👥 投保人數：
  ▪ 15歲以上：${clientState.adultCount} 人 (每人 ${document.getElementById("txtAdultUnitPrice").textContent})
  ▪ 未滿15歲：${clientState.childCount} 人 (每人 ${document.getElementById("txtChildUnitPrice").textContent})
━━━━━━━━━━━━━━━
身故保額：15歲以上 ${clientState.adultDeath} / 未滿15歲失能 ${clientState.childDeath}
傷害醫療：${clientState.medical}
💰 應收總保費：NT$ ${totalText} 元
━━━━━━━━━━━━━━━
業務員溫馨提醒：
出門在外多一分保障，多一分安心！本試算結果為即時保費參考，實際承保內容以投保條款為準。`;

        // 複製至剪貼簿
        const dummy = document.createElement("textarea");
        document.body.appendChild(dummy);
        dummy.value = quoteText;
        dummy.select();
        document.execCommand("copy");
        document.body.removeChild(dummy);

        showToast("報價單已成功複製到剪貼簿！");
      }
    }

    // 顯示提示彈窗
    function showToast(msg) {
      const toast = document.getElementById("toast");
      const toastMsg = document.getElementById("toastMsg");
      toastMsg.textContent = msg;
      
      toast.classList.remove("opacity-0", "scale-95", "pointer-events-none");
      toast.classList.add("opacity-100", "scale-100");

      setTimeout(() => {
        toast.classList.add("opacity-0", "scale-95", "pointer-events-none");
        toast.classList.remove("opacity-100", "scale-100");
      }, 3000);
    }
  </script>
</body>
</html>
